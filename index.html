}

/* ═══════════════════════ USER MODAL ═══════════════════════ */
function UserModal({ user, onClose, onSave, saving, setores=[], onAddSetor }) {
  const [name,setName]   = useState(user?.name||'');
  const [email,setEmail] = useState(user?.email||'');
  const [pw,setPw]       = useState('');
  const [role,setRole]   = useState(user?.role||'solicitante');
  const [setor,setSetor] = useState(user?.setor||'');
  const [novoSetor,setNovoSetor] = useState('');
  const [criandoSetor,setCriandoSetor] = useState(false);
  const [restrictExp,setRestrictExp] = useState((user?.allowed_expense_codes?.length||0)>0);
  const [selExp,setSelExp] = useState(new Set(user?.allowed_expense_codes||[]));
  const [restrictDoc,setRestrictDoc] = useState((user?.allowed_document_types?.length||0)>0);
  const [selDoc,setSelDoc] = useState(new Set(user?.allowed_document_types||[]));
  const [expSearch,setExpSearch] = useState('');
  const [mustChange,setMustChange] = useState(!!user?.must_change_password);
  const [tab,setTab] = useState('info'); // 'info' | 'exp' | 'doc'

  const toggleExp = v => setSelExp(p=>{ const s=new Set(p); s.has(v)?s.delete(v):s.add(v); return s; });
  const toggleDoc = v => setSelDoc(p=>{ const s=new Set(p); s.has(v)?s.delete(v):s.add(v); return s; });

  const submit = () => {
    if(!name.trim()||!email.trim()){alert('Nome e email obrigatórios');return;}
    if(!user&&!pw.trim()){alert('Senha obrigatória para novo usuário');return;}
    onSave({
      name:name.trim(), email:email.trim().toLowerCase(), password:pw,
      role, setor:setor.trim(),
      allowed_expense_codes: restrictExp?[...selExp]:[],
      allowed_document_types: restrictDoc?[...selDoc]:[],
      must_change_password: mustChange,
    });
  };

  const filteredExp = EXPENSE_TYPES.filter(e=>
    !expSearch || e.l.toLowerCase().includes(expSearch.toLowerCase()) || String(e.v).includes(expSearch));

  const inp = 'w-full px-3 py-2.5 rounded-xl text-sm';
  const is  = {background:'#FAFAF8',border:'1px solid #E0D9D0',color:'#1A1A1A'};
  const Lbl = ({c})=><label className="block text-xs font-semibold mb-1.5" style={{color:'#888',letterSpacing:'0.06em'}}>{c}</label>;

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 overlay" style={{background:'rgba(0,0,0,.5)'}}>
      <div className="w-full max-w-lg rounded-2xl slide-up flex flex-col" style={{background:'#fff',maxHeight:'90vh'}}>
        {/* Header */}
        <div className="flex items-center justify-between px-5 py-4" style={{borderBottom:'1px solid #EDE8E3'}}>
          <p className="font-bold" style={{color:'#1A1A1A'}}>{user?'Editar Usuário':'Novo Usuário'}</p>
          <button onClick={onClose} className="w-8 h-8 rounded-xl flex items-center justify-center text-lg hover:bg-gray-100" style={{color:'#AAA'}}>✕</button>
        </div>

        {/* Tabs */}
        <div className="flex px-5 pt-4 gap-1">
          {[['info','Dados'],['exp','Despesas'],['doc','Documentos']].map(([id,l])=>(
            <button key={id} onClick={()=>setTab(id)}
              className="px-4 py-1.5 rounded-lg text-xs font-semibold transition"
              style={{background:tab===id?'#282425':'#F5F0EB',color:tab===id?'#C9BBAA':'#888'}}>
              {l}{id==='exp'&&restrictExp&&selExp.size>0&&<span className="ml-1 text-xs opacity-70">({selExp.size})</span>}
              {id==='doc'&&restrictDoc&&selDoc.size>0&&<span className="ml-1 text-xs opacity-70">({selDoc.size})</span>}
            </button>
          ))}
        </div>

        {/* Body */}
        <div className="overflow-y-auto flex-1 px-5 pb-4 pt-4 space-y-3">
          {tab==='info'&&(<>
            <div className="grid grid-cols-2 gap-3">
              <div><Lbl c="NOME"/><input value={name} onChange={e=>setName(e.target.value)} className={inp} style={is} onFocus={e=>e.target.style.borderColor='#C9BBAA'} onBlur={e=>e.target.style.borderColor='#E0D9D0'}/></div>
              <div><Lbl c="FUNÇÃO"/>
                <select value={role} onChange={e=>setRole(e.target.value)} className={inp} style={{...is,appearance:'none'}} onFocus={e=>e.target.style.borderColor='#C9BBAA'} onBlur={e=>e.target.style.borderColor='#E0D9D0'}>
                  {Object.entries(ROLE_LABELS).map(([v,l])=><option key={v} value={v}>{l}</option>)}
                </select>
              </div>
            </div>
            <div><Lbl c="EMAIL"/><input type="email" value={email} onChange={e=>setEmail(e.target.value)} className={inp} style={is} onFocus={e=>e.target.style.borderColor='#C9BBAA'} onBlur={e=>e.target.style.borderColor='#E0D9D0'}/></div>
            <div><Lbl c="SETOR"/>
              {criandoSetor?(
                <div className="flex gap-2">
                  <input value={novoSetor} onChange={e=>setNovoSetor(e.target.value)}
                    placeholder="Nome do novo setor..."
                    className={inp+" flex-1"} style={is}
                    onKeyDown={async e=>{if(e.key==='Enter'){e.preventDefault();if(!novoSetor.trim())return;try{await onAddSetor(novoSetor.trim());setSetor(novoSetor.trim());setNovoSetor('');setCriandoSetor(false);}catch(err){}}}}
                    onFocus={e=>e.target.style.borderColor='#C9BBAA'} onBlur={e=>e.target.style.borderColor='#E0D9D0'}
                    autoFocus/>
                  <button type="button" onClick={async()=>{if(!novoSetor.trim())return;try{await onAddSetor(novoSetor.trim());setSetor(novoSetor.trim());setNovoSetor('');setCriandoSetor(false);}catch(err){}}}
                    className="px-3 py-2 rounded-xl text-sm font-semibold" style={{background:'#282425',color:'#C9BBAA'}}>✓</button>
                  <button type="button" onClick={()=>{setCriandoSetor(false);setNovoSetor('');}}
                    className="px-3 py-2 rounded-xl text-sm" style={{background:'#F5F0EB',color:'#888'}}>✕</button>
                </div>
              ):(
                <select value={setor} onChange={e=>{if(e.target.value==='__new__'){setCriandoSetor(true);}else{setSetor(e.target.value);}}}
                  className={inp} style={{...is,appearance:'none'}}
                  onFocus={e=>e.target.style.borderColor='#C9BBAA'} onBlur={e=>e.target.style.borderColor='#E0D9D0'}>
                  <option value="">— Selecione o setor —</option>
                  {setores.map(s=><option key={s} value={s}>{s}</option>)}
                  <option value="__new__">＋ Criar novo setor</option>
                </select>
              )}
            </div>
            <div><Lbl c={user?'NOVA SENHA (deixe em branco para não alterar)':'SENHA PROVISÓRIA'}/>
              <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder={user?'••••••':''} className={inp} style={is} onFocus={e=>e.target.style.borderColor='#C9BBAA'} onBlur={e=>e.target.style.borderColor='#E0D9D0'}/></div>
            <label className="flex items-start gap-2.5 p-3 rounded-xl cursor-pointer" style={{background:'#F7F3EE',border:'1px solid #EDE8E3'}}>
              <input type="checkbox" checked={mustChange} onChange={e=>setMustChange(e.target.checked)} className="mt-0.5" style={{accentColor:'#0A0A0A'}}/>
              <span>
                <span className="text-sm font-semibold block" style={{color:'#1A1A1A'}}>Exigir troca de senha no 1º acesso</span>
                <span className="text-xs" style={{color:'#888'}}>O usuário define a própria senha ao entrar. Você informa só a senha provisória e não fica sabendo a definitiva.</span>
              </span>
            </label>
          </>)}

          {tab==='exp'&&(<>
            <div className="flex items-center justify-between p-3 rounded-xl" style={{background:'#F7F3EE',border:'1px solid #EDE8E3'}}>
              <div>
                <p className="text-sm font-semibold" style={{color:'#1A1A1A'}}>Restringir códigos de despesa</p>
                <p className="text-xs mt-0.5" style={{color:'#AAA'}}>Desativado = todas liberadas</p>
              </div>
              <button onClick={()=>setRestrictExp(p=>!p)}
                className="w-11 h-6 rounded-full transition-all relative"
                style={{background:restrictExp?'#282425':'#E0D9D0'}}>
                <span className="absolute top-1 w-4 h-4 bg-white rounded-full transition-all shadow-sm"
                  style={{left:restrictExp?'calc(100% - 20px)':'4px'}}/>
              </button>
            </div>
            {restrictExp&&(<>
              <input value={expSearch} onChange={e=>setExpSearch(e.target.value)} placeholder="Buscar despesa..."
                className={inp} style={{...is,marginBottom:'4px'}} onFocus={e=>e.target.style.borderColor='#C9BBAA'} onBlur={e=>e.target.style.borderColor='#E0D9D0'}/>
              <div className="rounded-xl overflow-y-auto space-y-0.5" style={{maxHeight:'220px',border:'1px solid #EDE8E3'}}>
                {filteredExp.map(e=>(
                  <label key={e.v} className="flex items-center gap-3 px-3 py-2 cursor-pointer hover:bg-gray-50 transition">
                    <input type="checkbox" checked={selExp.has(e.v)} onChange={()=>toggleExp(e.v)}
                      className="rounded" style={{accentColor:'#282425'}}/>
                    <span className="text-xs" style={{color:'#1A1A1A'}}><span style={{color:'#AAA',marginRight:'4px'}}>{e.v}</span>{e.l}</span>
                  </label>
                ))}
              </div>
              <p className="text-xs text-right" style={{color:'#AAA'}}>{selExp.size} selecionado{selExp.size!==1?'s':''}</p>
            </>)}
          </>)}

          {tab==='doc'&&(<>
            <div className="flex items-center justify-between p-3 rounded-xl" style={{background:'#F7F3EE',border:'1px solid #EDE8E3'}}>
              <div>
                <p className="text-sm font-semibold" style={{color:'#1A1A1A'}}>Restringir tipos de documento</p>
                <p className="text-xs mt-0.5" style={{color:'#AAA'}}>Desativado = todos liberados</p>
              </div>
              <button onClick={()=>setRestrictDoc(p=>!p)}
                className="w-11 h-6 rounded-full transition-all relative"
                style={{background:restrictDoc?'#282425':'#E0D9D0'}}>
                <span className="absolute top-1 w-4 h-4 bg-white rounded-full transition-all shadow-sm"
                  style={{left:restrictDoc?'calc(100% - 20px)':'4px'}}/>
              </button>
            </div>
            {restrictDoc&&(
              <div className="rounded-xl overflow-y-auto space-y-0.5" style={{maxHeight:'260px',border:'1px solid #EDE8E3'}}>
                {DOCUMENT_TYPES.map(d=>(
                  <label key={d.v} className="flex items-center gap-3 px-3 py-2 cursor-pointer hover:bg-gray-50 transition">
                    <input type="checkbox" checked={selDoc.has(d.v)} onChange={()=>toggleDoc(d.v)}
                      style={{accentColor:'#282425'}}/>
                    <span className="text-xs" style={{color:'#1A1A1A'}}><span style={{color:'#AAA',marginRight:'4px'}}>{d.v}</span>{d.l}</span>
                  </label>
                ))}
              </div>
            )}
          </>)}
        </div>

        {/* Footer */}
        <div className="px-5 py-4 flex gap-2" style={{borderTop:'1px solid #EDE8E3'}}>
          <button onClick={onClose} className="flex-1 py-2.5 rounded-xl text-sm font-medium"
            style={{border:'1px solid #E0D9D0',color:'#666'}}>Cancelar</button>
          <button onClick={submit} disabled={saving}
            className="flex-1 py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 disabled:opacity-60"
            style={{background:'#282425',color:'#C9BBAA'}}>
            {saving?<><Spinner/>Salvando...</>:'Salvar'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════ TROCA DE SENHA NO 1º ACESSO ═══════════════════════ */
function ForcePasswordChange({ user, onDone, onLogout }) {
  const [pw,setPw]=useState('');
  const [pw2,setPw2]=useState('');
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);
  const go = async () => {
    if(pw.length<6){setErr('A senha deve ter ao menos 6 caracteres');return;}
    if(pw!==pw2){setErr('As senhas não conferem');return;}
    setLoading(true); setErr('');
    try {
      await sbAdminUsers('set_own_password',{ password: pw });
      onDone();
    } catch(e){ setErr(e.message||'Erro ao salvar a senha'); setLoading(false); }
  };
  const inp='w-full px-4 py-3 rounded-xl text-sm transition';
  const is={background:'#211D1E',border:'1px solid #3A3536',color:'#EAE3DA'};
  return (
    <div className="min-h-screen flex items-center justify-center p-6" style={{background:'radial-gradient(1200px 600px at 50% -10%, #332E2F 0%, #282425 55%, #201C1D 100%)'}}>
      <div className="w-full max-w-sm fade">
        <div className="text-center mb-8">
          <DeepLogo variant="login"/>
          <div className="flex items-center justify-center gap-2.5 mt-5">
            <span style={{height:'1px',width:'26px',background:'#4A4442'}}/>
            <span style={{color:'#9A928A',fontSize:'11px',letterSpacing:'0.18em',textTransform:'uppercase'}}>Primeiro acesso</span>
            <span style={{height:'1px',width:'26px',background:'#4A4442'}}/>
          </div>
        </div>
        <div className="rounded-2xl p-7" style={{background:'rgba(42,38,39,0.6)',border:'1px solid #3A3536',backdropFilter:'blur(8px)'}}>
          <p className="text-sm font-semibold mb-1" style={{color:'var(--bone)'}}>Olá, {user.name?.split(' ')[0]||''}</p>
          <p className="text-xs mb-5" style={{color:'#9A928A'}}>Defina uma senha pessoal para continuar. Só você a conhecerá.</p>
          <div className="space-y-4">
            <div>
              <label className="block text-xs font-medium mb-2" style={{color:'#9A928A'}}>Nova senha</label>
              <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="Mínimo 6 caracteres"
                className={inp} style={is} onFocus={e=>e.target.style.borderColor='var(--hazelnut)'} onBlur={e=>e.target.style.borderColor='#3A3536'}/>
            </div>
            <div>
              <label className="block text-xs font-medium mb-2" style={{color:'#9A928A'}}>Confirmar nova senha</label>
              <input type="password" value={pw2} onChange={e=>setPw2(e.target.value)} placeholder="Repita a senha"
                onKeyDown={e=>e.key==='Enter'&&go()}
                className={inp} style={is} onFocus={e=>e.target.style.borderColor='var(--hazelnut)'} onBlur={e=>e.target.style.borderColor='#3A3536'}/>
            </div>
            {err&&<div className="flex items-center gap-2 text-xs rounded-lg px-3 py-2.5" style={{background:'rgba(220,38,38,0.12)',border:'1px solid rgba(220,38,38,0.25)',color:'#F0A0A0'}}><I.alert/>{err}</div>}
            <button onClick={go} disabled={loading}
              className="w-full py-3 rounded-xl text-sm font-semibold mt-1 transition-all active:scale-[0.98] flex items-center justify-center gap-2 disabled:opacity-60"
              style={{background:'var(--bone)',color:'var(--noir)'}}>
              {loading?<><Spinner/>Salvando...</>:'Salvar e entrar'}
            </button>
            <button onClick={onLogout} className="w-full text-xs py-1" style={{color:'#6B655E'}}>Sair</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════ APP ═══════════════════════ */
function App() {
  const [user,setUser]=useState(null);
  const [view,setView]=useState('dashboard');
  const [listView,setListView]=useState('pagamentos');
  const [selected,setSelected]=useState(null);
  const [editingReq,setEditingReq]=useState(null);
  const [toast,setToast]=useState(null);
  const [menuOpen,setMenuOpen]=useState(false);
  const [appLoading,setAppLoading]=useState(false);
  const [requests,dispatch]=useReducer(reducer,[]);

  const showToast=(msg,type='ok')=>{setToast({msg,type});setTimeout(()=>setToast(null),3500);};

  // Carrega o threshold do banco (após login, pois o RLS exige usuário autenticado)
  const loadThreshold = async () => {
    try {
      const rows = await sbSelect('configuracoes','?chave=eq.threshold');
      if(rows?.[0]?.valor){ const v=parseFloat(rows[0].valor); if(!isNaN(v)&&v>0) setThreshold(v); }
    } catch {}
  };

  const loadRequests = async () => {
    setAppLoading(true);
    try {
      const rows = await sbSelect('requests','?order=created_at.desc')||[];
      const normalized = rows.map(r=>({
        ...r,
        solicitanteId:     r.solicitante_id||'',
        solicitanteName:   r.solicitante_name||r.created_by||'',
        tipo:              r.tipo||'pagamento',
        chave_pix:         r.chave_pix||'',
        favorecido:        r.favorecido||'',
        servico_convertido:r.servico_convertido||false,
        setor:             r.setor||'',
        created_at: r.created_at
          ? new Date(r.created_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})
          : '',
        receipts: r.receipts||[],
        history:  r.history||[],
        totvs:    r.totvs||{},
      }));
      dispatch({type:'SET', reqs: normalized});
    } catch(e){ showToast('Aviso: nao foi possivel carregar do banco','err'); }
    setAppLoading(false);
  };

  const handleLogin = async (u) => {
    setUser(u);
    setView(u.role==='solicitante'?'pagamentos':'dashboard');
    loadThreshold();
    await loadRequests();
  };

  const handleUpdate = async (updatedReq) => {
    const newStatus = updatedReq.status || 'pending_gestor';
    const toastMsg  = newStatus === 'pending_diretor'
      ? 'Reenviado ao diretor!'
      : 'Reenviado ao gestor!';
    dispatch({type:'EDIT_FIELDS', id:updatedReq.id, fields:{
      title:updatedReq.title, description:updatedReq.description,
      amount:updatedReq.amount, category:updatedReq.category,
      totvs:updatedReq.totvs, receipts:updatedReq.receipts,
      chave_pix:updatedReq.chave_pix, favorecido:updatedReq.favorecido,
      ...(updatedReq.valor_aprovado!==undefined?{valor_aprovado:updatedReq.valor_aprovado}:{}),
      status:newStatus, history:updatedReq.history,
    }});
    setEditingReq(null);
    setView(listView||'pagamentos');
    showToast(toastMsg);
    try {
      await sbUpdate('requests',{
        title:updatedReq.title, description:updatedReq.description,
        amount:updatedReq.amount, category:updatedReq.category,
        totvs:updatedReq.totvs, receipts:updatedReq.receipts,
        ...(updatedReq.chave_pix!==undefined?{chave_pix:updatedReq.chave_pix}:{}),
        ...(updatedReq.favorecido!==undefined?{favorecido:updatedReq.favorecido}:{}),
        ...(updatedReq.valor_aprovado!==undefined?{valor_aprovado:updatedReq.valor_aprovado}:{}),
        status:newStatus, history:updatedReq.history,
        updated_at:new Date().toISOString(),
      },`?id=eq.${updatedReq.id}`);
    } catch(e){
      // Se o banco recusou (ex.: trava de valor), mostra a mensagem real e desfaz a alteração local
      const msg = /maior que o aprovado|valor_aprovado/i.test(e.message||'')
        ? 'Valor superior ao aprovado pelo aprovador — alteração não salva.'
        : (e.message||'Erro ao salvar no banco');
      showToast(msg,'err');
      loadRequests();
    }
  };

  const handleSubmit = async (req) => {
    dispatch({type:'ADD',req});
    setView(req.tipo==='servico'?'servicos':'pagamentos');
    const msg = req.tipo==='servico'?'Serviço enviado ao diretor!':(req.status==='pending_diretor'?'Pagamento enviado ao diretor!':'Solicitação enviada para o gestor!');
    showToast(msg);
    try {
      await sbInsert('requests',{
        id:req.id, title:req.title,
        description:req.description||'', amount:req.amount,
        category:req.category||'', status:req.status,
        tipo:req.tipo||'pagamento',
        chave_pix:req.chave_pix||'',
        favorecido:req.favorecido||'',
        servico_convertido:req.servico_convertido||false,
        setor:user.setor||'',
        created_by:req.solicitanteName,
        solicitante_id:req.solicitanteId,
        solicitante_name:req.solicitanteName,
        history:req.history, totvs:req.totvs,
        receipts:(req.receipts||[]).map(r=>({name:r.name,type:r.type,data:r.data})),
        sent_to_totvs:false,
      });
    } catch(e){ showToast('Aviso: erro ao salvar no banco','err'); }
  };

  const syncDispatch = async (action) => {
    dispatch(action);
    if(action.type==='UPDATE'){
      try {
        const cur = requests.find(r=>r.id===action.id);
        const newHist = [...(cur?.history||[]),{
          date:fmtDate(), actor:action.actor, action:action.label, comment:action.comment||''
        }];
        await sbUpdate('requests',{
          status:action.status, history:newHist,
          ...(action.fields||{}),
          updated_at:new Date().toISOString(),
        },`?id=eq.${action.id}`);
      } catch(e){ console.warn('Supabase sync:',e); }
    }
    // CONVERT é tratado diretamente pelo convertService() no RequestDetail (já faz sbUpdate)
  };

  // ── Verificação automática de situação no TOTVS (cancela no site o que foi cancelado lá) ──
  const requestsRef = useRef(requests); requestsRef.current = requests;
  const syncRef = useRef(syncDispatch); syncRef.current = syncDispatch;
  const totvsSyncRunning = useRef(false);
  const runTotvsSync = useCallback(async ()=>{
    if(totvsSyncRunning.current) return;
    if(!user || !['admin','financeiro'].includes(user.role)) return;
    const candidates = (requestsRef.current||[]).filter(r=> r.sent_to_totvs && r.totvs?.duplicateCode && r.status!=='cancelled');
    if(!candidates.length) return;
    totvsSyncRunning.current = true;
    try{
      const token = await totvsGetToken();
      const cancelled = await totvsFetchCancelledCodes(token, candidates.map(r=>r.totvs.duplicateCode));
      for(const r of candidates){
        if(cancelled.has(Number(r.totvs.duplicateCode))){
          await syncRef.current({type:'UPDATE', id:r.id, status:'cancelled', actor:'Sistema',
            label:`Cancelado automaticamente — duplicata cancelada no TOTVS (verificado em ${fmtDate()})`, comment:''});
        }
      }
    }catch(e){ console.warn('TOTVS sync:',e); }
    finally{ totvsSyncRunning.current = false; }
  },[user]);

  useEffect(()=>{
    if(!user || !['admin','financeiro'].includes(user.role)) return;
    const t0 = setTimeout(runTotvsSync, 20000);        // 20s depois de abrir
    const iv = setInterval(runTotvsSync, 15*60*1000);  // a cada 15 min
    return ()=>{ clearTimeout(t0); clearInterval(iv); };
  },[user, runTotvsSync]);

  if(!user) return <LoginPage onLogin={handleLogin}/>;
  if(user.must_change_password) return <ForcePasswordChange user={user} onDone={()=>setUser(u=>({...u,must_change_password:false}))} onLogout={()=>{sbSignOut();setUser(null);}}/>;

  const selectedReq = requests.find(r=>r.id===selected);
  const toastStyle  = toast?.type==='ok' ? {background:'#282425',color:'#C9BBAA'} : {background:'#DC2626',color:'#fff'};

  return (
    <div className="min-h-screen" style={{background:'var(--page)'}}>
      <Sidebar user={user} view={view} setView={setView}
        onLogout={()=>{sbSignOut();setUser(null);dispatch({type:'SET',reqs:[]});}}
        onNewRequest={()=>setView('new')} mobileOpen={menuOpen} onClose={()=>setMenuOpen(false)}/>

      <div className="md:hidden fixed top-0 left-0 right-0 z-20 flex items-center justify-between px-4 py-3"
        style={{background:'var(--noir)',borderBottom:'1px solid var(--noir-line)'}}>
        <button onClick={()=>setMenuOpen(true)} style={{color:'var(--bone)',cursor:'pointer'}}><I.menu/></button>
        <DeepLogo variant="mobile"/>
        <div className="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold"
          style={{background:'rgba(221,212,201,.18)',color:'var(--bone)'}}>
          {user.name.split(' ').map(w=>w[0]).slice(0,2).join('')}
        </div>
      </div>

      <main className="md:ml-56 pt-14 md:pt-0">
        <div className="max-w-5xl mx-auto px-4 md:px-8 py-6 md:py-8">

          {toast&&(
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-full text-sm font-semibold shadow-xl fade flex items-center gap-2" style={toastStyle}>
              {toast.type==='ok'?<I.check/>:<I.alert/>} {toast.msg}
            </div>
          )}

          {appLoading?(
            <div className="flex items-center justify-center py-24 gap-3">
              <Spinner/><span style={{color:'var(--ink-soft)',fontSize:'14px'}}>Carregando...</span>
            </div>
          ):(
            <>
              {view==='dashboard' && <DashboardView user={user} requests={requests}/>}
              {view==='pagamentos'&& <SolicitacoesView user={user} requests={requests} tipoFilter='pagamentos' onSelect={id=>{setListView('pagamentos');setSelected(id);setView('detail');}} onNew={()=>{setListView('pagamentos');setView('new');}} dispatch={syncDispatch} showToast={showToast}/>}
              {view==='servicos'  && <SolicitacoesView user={user} requests={requests} tipoFilter='servicos'   onSelect={id=>{setListView('servicos');setSelected(id);setView('detail');}}   onNew={()=>{setListView('servicos');setView('new');}}   dispatch={syncDispatch} showToast={showToast}/>}
              {view==='new'       && <NewRequestForm user={user} requests={requests} defaultTipo={listView==='servicos'?'servico':'pagamento'} onSubmit={handleSubmit} onBack={()=>setView(listView||'pagamentos')}/>}
              {view==='edit'      && <NewRequestForm user={user} requests={requests} editReq={editingReq} onSubmit={handleUpdate} onBack={()=>{setEditingReq(null);setView('detail');}}/>}
              {view==='detail'&&selectedReq && <RequestDetail req={selectedReq} user={user} onBack={()=>setView(listView||'pagamentos')} dispatch={syncDispatch} showToast={showToast} onEdit={r=>{setEditingReq(r);setView('edit');}}/>}
              {view==='admin'     && <AdminView showToast={showToast}/>}
            </>
          )}

        </div>
      </main>

      <div className="hidden md:block fixed bottom-3 right-4 text-xs font-mono" style={{color:'#B8AE9E'}}>Deep Pagamentos</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
