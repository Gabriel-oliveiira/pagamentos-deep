async function sbSignIn(email, password) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method:'POST', headers:{'apikey':SUPABASE_ANON,'Content-Type':'application/json'},
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) { const e=new Error(data.error_description||data.msg||'Login inválido'); e.authFail=true; throw e; }
  ACCESS_TOKEN = data.access_token; REFRESH_TOKEN = data.refresh_token; sbPersist();
  return data.user;
}
async function sbRefresh() {
  if(!REFRESH_TOKEN) return false;
  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method:'POST', headers:{'apikey':SUPABASE_ANON,'Content-Type':'application/json'},
      body: JSON.stringify({ refresh_token: REFRESH_TOKEN }),
    });
    if(!res.ok) return false;
    const data = await res.json();
    ACCESS_TOKEN = data.access_token; REFRESH_TOKEN = data.refresh_token; sbPersist();
    return true;
  } catch { return false; }
}
function sbSignOut(){ ACCESS_TOKEN=null; REFRESH_TOKEN=null; sbPersist(); }

async function sbFetch(table, q='', opts={}) {
  const { headers: extra, ...rest } = opts;
  const doFetch = () => fetch(`${SUPABASE_URL}/rest/v1/${table}${q}`, { headers:{...authHeaders(), ...(extra||{})}, ...rest });
  let res = await doFetch();
  if (res.status === 401 && REFRESH_TOKEN && await sbRefresh()) res = await doFetch();
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) throw new Error(data?.message || data?.error || `Supabase ${res.status}`);
  return data;
}
const sbSelect = (t,q='')      => sbFetch(t, q);

// Consulta a situação das duplicatas no TOTVS. Retorna um Set com os códigos que estão CANCELADOS.
async function totvsFetchCancelledCodes(token, codes){
  const cancelled = new Set();
  const byCode = {}; // code -> {found, canceled}
  const uniq = [...new Set((codes||[]).map(Number).filter(Boolean))];
  for(let i=0;i<uniq.length;i+=100){
    const chunk = uniq.slice(i,i+100);
    let page=1, hasNext=true, guard=0;
    while(hasNext && guard++<50){
      const res = await fetch(TOTVS_API+'/search',{
        method:'POST',
        headers:{'Content-Type':'application/json','Accept':'application/json','Authorization':'Bearer '+token},
        body: JSON.stringify({filter:{branchCodeList:[TOTVS_BRANCH_CODE],duplicateCodeList:chunk},page,pageSize:100}),
      });
      if(!res.ok) break;
      const data = await res.json();
      (data.items||[]).forEach(it=>{
        const c = Number(it.duplicateCode);
        // TOTVS devolve a situação como letra: C = Cancelada (N=Normal, A=Agrupada, D=Devolvida, L=Liquidada, Q=Quebrada)
        const isC = it.status==='C' || it.status==='Canceled' || it.status===1;
        if(!byCode[c]) byCode[c]={found:0,canceled:0};
        byCode[c].found++; if(isC) byCode[c].canceled++;
      });
      hasNext = !!data.hasNext;
      page++;
    }
  }
  // Cancelada só quando TODAS as parcelas encontradas estão canceladas
  Object.entries(byCode).forEach(([c,v])=>{ if(v.found>0 && v.canceled===v.found) cancelled.add(Number(c)); });
  return cancelled;
}

/* ═══════════════════════ HELPERS ═══════════════════════ */
const R = (v) => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
// Data local (Brasil) no formato YYYY-MM-DD — evita o bug de UTC avançar um dia depois das 21h
const localDateStr = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
// Data mínima de vencimento = amanhã (TOTVS exige vencimento posterior a hoje)
const minDueDate = () => { const d=new Date(); d.setDate(d.getDate()+1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fmtDate = () => new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});

function reducer(state, action) {
  switch(action.type) {
    case 'SET':       return action.reqs;
    case 'ADD':       return [action.req,...state];
    case 'MARK_SENT': return state.map(r => r.id!==action.id ? r : {...r, sent_to_totvs:true});
    case 'UPDATE': return state.map(r => r.id!==action.id ? r : {
      ...r, status:action.status, ...(action.fields||{}),
      history:[...r.history,{date:fmtDate(),actor:action.actor,action:action.label,comment:action.comment||''}]
    });
    case 'EDIT_FIELDS': return state.map(r => r.id!==action.id ? r : {...r, ...action.fields});
    case 'CONVERT': return state.map(r => r.id!==action.id ? r : {
      ...r, status: action.status||'pending_gestor',
      amount: action.amount,
      totvs: action.totvs,
      servico_convertido: true,
      ...(action.description!==undefined?{description:action.description}:{}),
      ...(action.receipts!==undefined?{receipts:action.receipts}:{}),
      ...(action.chave_pix!==undefined?{chave_pix:action.chave_pix}:{}),
      ...(action.favorecido!==undefined?{favorecido:action.favorecido}:{}),
      history:[...r.history,{date:fmtDate(),actor:action.actor,action:action.action||'Serviço concluído — convertido para pagamento e enviado ao gestor',comment:action.comment||''}]
    });
    default: return state;
  }
}

/* ═══════════════════════ CHARTS ═══════════════════════ */
function BarChart({ labels, values }) {
  const ref = useRef(); const chart = useRef();
  useEffect(() => {
    if (!window.Chart || !ref.current || !labels.length) return;
    if (chart.current) chart.current.destroy();
    chart.current = new window.Chart(ref.current.getContext('2d'), {
      type:'bar',
      data:{ labels, datasets:[{ data:values, backgroundColor:'#C9BBAA', hoverBackgroundColor:'#B8A892', borderRadius:6, borderSkipped:false }] },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:c=>R(c.raw) }, backgroundColor:'#282425', titleFont:{family:'Raleway'}, bodyFont:{family:'Raleway'} } },
        scales:{
          y:{ beginAtZero:true, grid:{color:'rgba(0,0,0,.05)'}, ticks:{ callback:v=>v>=1000?'R$'+(v/1000).toFixed(0)+'k':'R$'+v, color:'#999', font:{family:'Raleway',size:11} }, border:{display:false} },
          x:{ grid:{display:false}, ticks:{color:'#888',font:{family:'Raleway',size:11}}, border:{display:false} }
        }
      }
    });
    return ()=>{ if(chart.current) chart.current.destroy(); };
  },[labels.join(','), values.join(',')]);
  if(!labels.length) return <div className="h-full flex items-center justify-center text-sm text-gray-400">Sem dados</div>;
  return <canvas ref={ref}/>;
}

function DonutChart({ data }) {
  const ref = useRef(); const chart = useRef();
  const labels = data.map(d=>d.label), values = data.map(d=>d.value), colors = data.map(d=>d.color);
  useEffect(() => {
    if (!window.Chart || !ref.current || !data.length) return;
    if (chart.current) chart.current.destroy();
    chart.current = new window.Chart(ref.current.getContext('2d'), {
      type:'doughnut',
      data:{ labels, datasets:[{ data:values, backgroundColor:colors, borderWidth:0, hoverOffset:4 }] },
      options:{
        responsive:true, maintainAspectRatio:false, cutout:'68%',
        plugins:{
          legend:{ position:'bottom', labels:{ color:'#666', font:{family:'Raleway',size:11}, padding:12, boxWidth:10, boxHeight:10, usePointStyle:true } },
          tooltip:{ backgroundColor:'#282425', titleFont:{family:'Raleway'}, bodyFont:{family:'Raleway'} }
        }
      }
    });
    return ()=>{ if(chart.current) chart.current.destroy(); };
  },[JSON.stringify(data)]);
  if(!data.length) return <div className="h-full flex items-center justify-center text-sm text-gray-400">Sem dados</div>;
  return <canvas ref={ref}/>;
}

function LineChart({ labels, values }) {
  const ref = useRef(); const chart = useRef();
  useEffect(() => {
    if (!window.Chart || !ref.current || !labels.length) return;
    if (chart.current) chart.current.destroy();
    const ctx = ref.current.getContext('2d');
    const grad = ctx.createLinearGradient(0,0,0,200);
    grad.addColorStop(0,'rgba(138,98,72,0.28)'); grad.addColorStop(1,'rgba(138,98,72,0)');
    chart.current = new window.Chart(ctx, {
      type:'line',
      data:{ labels, datasets:[{ data:values, borderColor:'#8A6248', backgroundColor:grad, fill:true, tension:0.35, borderWidth:2, pointRadius:3, pointBackgroundColor:'#8A6248', pointHoverRadius:5 }] },
      options:{

        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:c=>R(c.raw) }, backgroundColor:'#282425', titleFont:{family:'Raleway'}, bodyFont:{family:'Raleway'} } },

          x:{ grid:{display:false}, ticks:{color:'#888',font:{family:'Raleway',size:11}}, border:{display:false} }

      }
    });
    return ()=>{ if(chart.current) chart.current.destroy(); };
  },[labels.join(','), values.join(',')]);
  if(!labels.length) return <div className="h-full flex items-center justify-center text-sm text-gray-400">Sem dados</div>;

}

/* ═══════════════════════ DASHBOARD ═══════════════════════ */
function DashboardView({ user, requests }) {
  const [period,setPeriod]=useState('mes'); // 'mes' | '30d' | 'tudo'
  const now=Date.now();
  const startMonth=(()=>{ const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),1).getTime(); })();
  const periodStart = period==='mes'?startMonth : period==='30d'?(now-30*86400000) : 0;
  const periodLabel = period==='mes'?'neste mês' : period==='30d'?'nos últimos 30 dias' : 'no total';

  // Escopo por papel
  let scope = requests;
  if(user.role==='solicitante')             scope=requests.filter(r=>r.solicitanteId===user.id);
  else if(user.role==='gestor'&&user.setor) scope=requests.filter(r=>r.setor===user.setor);

  const base = scope.filter(r=>(r.created_ts||now) >= periodStart);
  const IN_FLOW=['open','pending_gestor','pending_diretor','pending_financeiro','servico_aprovado'];

  const total=base.length;
  const valorTotal=base.reduce((s,r)=>s+r.amount,0);
  const emAberto=base.filter(r=>IN_FLOW.includes(r.status)).reduce((s,r)=>s+r.amount,0);
  const aguardando=base.filter(r=>['pending_gestor','pending_diretor','pending_financeiro'].includes(r.status)).length;
  const concluidas=base.filter(r=>r.status==='completed').length;
  const ticket= total? valorTotal/total : 0;

  // Comparação com o período anterior (mês anterior / 30 dias anteriores)
  const prevRange = period==='mes'
    ? [new Date(new Date(startMonth).getFullYear(), new Date(startMonth).getMonth()-1, 1).getTime(), startMonth]
    : period==='30d' ? [now-60*86400000, now-30*86400000] : null;
  const prevBase = prevRange ? scope.filter(r=>{const t=r.created_ts||0; return t>=prevRange[0] && t<prevRange[1];}) : null;
  const pct=(cur,prev)=> (prev && prev>0) ? Math.round((cur-prev)/prev*100) : null;
  const deltaTotal = prevBase ? pct(total, prevBase.length) : null;
  const deltaValor = prevBase ? pct(valorTotal, prevBase.reduce((s,r)=>s+r.amount,0)) : null;

  const byStatus=Object.entries(STATUS).map(([k,s])=>({label:s.label,value:base.filter(r=>r.status===k).length,color:CHART_COLORS[k]})).filter(s=>s.value>0);
  const byCat=CATEGORIES.map(cat=>({label:cat,value:base.filter(r=>r.category===cat).reduce((s,r)=>s+r.amount,0)})).filter(c=>c.value>0);
  const setorMap={}; base.forEach(r=>{const k=(r.setor||'—');setorMap[k]=(setorMap[k]||0)+r.amount;});
  const bySetor=Object.entries(setorMap).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value);
  const showSetor=['diretor','financeiro','admin'].includes(user.role)&&bySetor.length>0;

  // Evolução — 6 meses (usa o escopo inteiro, independe do filtro de período)
  const months=[]; { const d=new Date(); for(let i=5;i>=0;i--) months.push(new Date(d.getFullYear(),d.getMonth()-i,1)); }
  const evoLabels=months.map(m=>m.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+'/'+String(m.getFullYear()).slice(2));
  const evoValues=months.map(m=>{const s=m.getTime();const e=new Date(m.getFullYear(),m.getMonth()+1,1).getTime();return scope.filter(r=>{const t=r.created_ts||0;return t>=s&&t<e;}).reduce((a,r)=>a+r.amount,0);});

  // Pendências travadas — paradas há mais tempo (escopo inteiro)
  const parado=scope.filter(r=>IN_FLOW.includes(r.status)).map(r=>({r,dias:Math.floor((now-(r.updated_ts||r.created_ts||now))/86400000)})).sort((a,b)=>b.dias-a.dias).slice(0,6);

  // Rankings (no período)
  const rank=fn=>{const m={};base.forEach(r=>{const k=fn(r);if(!k)return;m[k]=(m[k]||0)+r.amount;});return Object.entries(m).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value).slice(0,5);};
  const topForn=rank(r=>r.favorecido&&r.favorecido.trim());
  const topSolic=rank(r=>r.solicitanteName);

  const KPI=({label,value,sub,accent,delta})=>(
    <div className="rounded-2xl p-4 md:p-5" style={{background:'#fff',border:'1px solid #EDE8E3',minWidth:0}}>
      <p className="text-xs font-semibold mb-2 truncate" style={{color:'#999',letterSpacing:'0.07em'}} title={label}>{label}</p>
      <p className="font-bold leading-tight" style={{color:accent||'#1A1A1A',fontSize:'clamp(0.95rem, 4.4vw, 1.4rem)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}} title={typeof value==='string'?value:undefined}>{value}</p>
      <div className="flex items-center gap-1.5 mt-1 min-w-0">
        {delta!=null && <span className="flex-shrink-0" style={{fontSize:'11px',fontWeight:700,color:delta>=0?'#15803D':'#DC2626'}}>{delta>=0?'▲':'▼'} {Math.abs(delta)}%</span>}
        {sub && <p className="text-xs truncate" style={{color:'#AAA'}} title={sub}>{sub}</p>}
      </div>
    </div>
  );
  const Card=({title,sub,children,className=''})=>(
    <div className={"rounded-2xl p-5 "+className} style={{background:'#fff',border:'1px solid #EDE8E3'}}>
      <p className="text-sm font-bold mb-0.5" style={{color:'#1A1A1A'}}>{title}</p>
      {sub && <p className="text-xs mb-4" style={{color:'#AAA'}}>{sub}</p>}
      {children}
    </div>
  );
  const RankList=({items,color='#C9BBAA'})=>{
    const max=items.reduce((m,i)=>Math.max(m,i.value),0)||1;
    if(!items.length) return <p className="text-sm text-center py-6" style={{color:'#BBB'}}>Sem dados no período</p>;
    return <div className="space-y-2.5">{items.map((it,i)=>(
      <div key={i}>
        <div className="flex items-center justify-between gap-2 text-xs mb-1">
          <span className="truncate" style={{color:'#555'}}>{i+1}. {it.label}</span>
          <span className="font-bold flex-shrink-0" style={{color:'#8A6248'}}>{R(it.value)}</span>
        </div>
        <div style={{height:'6px',background:'#F2EDE6',borderRadius:'99px'}}><div style={{width:(it.value/max*100)+'%',height:'6px',background:color,borderRadius:'99px'}}/></div>
      </div>
    ))}</div>;
  };
  const pBtn=(id,label)=>(
    <button onClick={()=>setPeriod(id)} className="px-3 py-1.5 rounded-lg text-xs font-semibold transition"
      style={period===id?{background:'#282425',color:'#EDE6DD'}:{background:'#fff',border:'1px solid #EDE8E3',color:'#777'}}>{label}</button>
  );

  return (
    <div className="fade">
      <div className="flex items-start justify-between gap-3 flex-wrap mb-6">
        <div>
          <h1 className="text-xl font-bold" style={{color:'#1A1A1A'}}>Dashboard</h1>
          <p className="text-sm mt-0.5" style={{color:'#888'}}>Visão geral {periodLabel}</p>
        </div>
        <div className="flex items-center gap-1.5">{pBtn('mes','Mês')}{pBtn('30d','30 dias')}{pBtn('tudo','Tudo')}</div>
      </div>

      {/* KPIs */}
      <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-4">
        <KPI label="SOLICITAÇÕES" value={total} delta={deltaTotal} sub={deltaTotal!=null?'vs. anterior':periodLabel}/>
        <KPI label="VALOR TOTAL" value={R(valorTotal)} delta={deltaValor} sub={deltaValor!=null?'vs. anterior':'soma no período'} accent="#8A6248"/>
        <KPI label="EM ABERTO" value={R(emAberto)} sub="ainda não concluído" accent="#B45309"/>
        <KPI label="AGUARDANDO" value={aguardando} sub="em aprovação" accent="#F59E0B"/>
        <KPI label="CONCLUÍDAS" value={concluidas} sub="finalizadas" accent="#15803D"/>
        <KPI label="TICKET MÉDIO" value={R(ticket)} sub="valor médio" accent="#6D28D9"/>
      </div>

      {/* Evolução + Status */}
      <div className="grid grid-cols-1 lg:grid-cols-5 gap-4 mb-4">
        <Card title="Evolução (6 meses)" sub="Valor total por mês" className="lg:col-span-3">
          <div className="chart-wrap"><LineChart labels={evoLabels} values={evoValues}/></div>
        </Card>
        <Card title="Status" sub={"Distribuição "+periodLabel} className="lg:col-span-2">
          <div className="chart-wrap"><DonutChart data={byStatus}/></div>
        </Card>
      </div>

      {/* Setor + Categoria */}
      <div className={"grid grid-cols-1 gap-4 mb-4 "+(showSetor?'lg:grid-cols-2':'')}>
        {showSetor && (
          <Card title="Valor por Setor" sub={"Total em R$ "+periodLabel}>
            <div className="chart-wrap"><BarChart labels={bySetor.map(s=>s.label)} values={bySetor.map(s=>s.value)}/></div>
          </Card>
        )}
        <Card title="Valor por Categoria" sub={"Total em R$ "+periodLabel}>
          <div className="chart-wrap"><BarChart labels={byCat.map(c=>c.label)} values={byCat.map(c=>c.value)}/></div>
        </Card>
      </div>

      {/* Pendências travadas + Rankings */}
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <Card title="Pendências travadas" sub="Paradas há mais tempo">
          {parado.length===0 ? <p className="text-sm text-center py-6" style={{color:'#BBB'}}>Nada parado 🎉</p> :
            <div className="space-y-1">
              {parado.map(({r,dias})=>(
                <div key={r.id} className="flex items-center justify-between gap-3 py-2 border-b last:border-0" style={{borderColor:'#F5F0EB'}}>
                  <div className="min-w-0">
                    <p className="text-sm font-medium truncate" style={{color:'#1A1A1A'}}>{r.title}</p>
                    <div className="mt-0.5"><Badge status={r.status}/></div>
                  </div>
                  <span className="text-xs font-bold flex-shrink-0" style={{color:dias>=7?'#DC2626':dias>=3?'#B45309':'#999'}}>{dias<=0?'hoje':'há '+dias+'d'}</span>
                </div>
              ))}
            </div>}
        </Card>
        <Card title="Top fornecedores" sub={"Maior valor "+periodLabel}><RankList items={topForn}/></Card>
        <Card title="Top solicitantes" sub={"Maior valor "+periodLabel}><RankList items={topSolic} color="#8A6248"/></Card>
      </div>
    </div>
  );
}

/* ═══════════════════════ SELECT COM BUSCA ═══════════════════════ */
function SearchSelect({ value, onChange, options, placeholder='Selecionar...', invalid=false }) {
  const [open,setOpen]=useState(false);
  const [q,setQ]=useState('');
  const ref=useRef();
  useEffect(()=>{
    const h=e=>{ if(ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown',h);
    return ()=>document.removeEventListener('mousedown',h);
  },[]);
  const selected = options.find(o=>String(o.value)===String(value));
  const filtered = q.trim() ? options.filter(o=>o.label.toLowerCase().includes(q.trim().toLowerCase())) : options;
  return (
    <div ref={ref} style={{position:'relative'}}>
      <div onClick={()=>{setOpen(o=>!o);setQ('');}}
        className="w-full px-3 py-2.5 rounded-xl text-sm flex items-center justify-between gap-2"
        style={{background:'#FAF8F5',border:`1px solid ${invalid?'#EF4444':'#E0D9D0'}`,cursor:'pointer'}}>
        <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:selected?'#1A1A1A':'#A9A29B'}}>{selected?selected.label:placeholder}</span>
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="#999" strokeWidth="2" style={{flexShrink:0}}><path strokeLinecap="round" d="M6 9l6 6 6-6"/></svg>
      </div>
      {open&&(
        <div style={{position:'absolute',zIndex:60,left:0,right:0,top:'calc(100% + 4px)',background:'#fff',border:'1px solid #E0D9D0',borderRadius:'12px',boxShadow:'0 14px 34px -10px rgba(0,0,0,0.22)',overflow:'hidden'}}>
          <div style={{padding:'8px'}}>
            <input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="Pesquisar..."
              className="w-full px-2.5 py-2 rounded-lg text-sm" style={{background:'#FAF8F5',border:'1px solid #E0D9D0',color:'#1A1A1A'}}/>
          </div>
          <div style={{maxHeight:'220px',overflowY:'auto'}}>
            {filtered.length===0 && <div style={{padding:'10px 12px',fontSize:'13px',color:'#AAA'}}>Nenhum resultado</div>}
            {filtered.map(o=>(
              <div key={o.value} onClick={()=>{onChange(String(o.value));setOpen(false);setQ('');}}
                className="px-3 py-2 text-sm cursor-pointer"
                style={{background:String(o.value)===String(value)?'#F5F0EB':'#fff',color:'#1A1A1A'}}
                onMouseEnter={e=>e.currentTarget.style.background='#F7F3EE'} onMouseLeave={e=>e.currentTarget.style.background=String(o.value)===String(value)?'#F5F0EB':'#fff'}>
                {o.label}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════ FORM NOVA SOLICITAÇÃO ═══════════════════════ */
function NewRequestForm({ user, requests, onSubmit, onBack, editReq, defaultTipo='pagamento' }) {
  const isEdit = !!editReq;
  const allowedExpenses = user.allowed_expense_codes?.length > 0
    ? EXPENSE_TYPES.filter(e => user.allowed_expense_codes.includes(e.v))
    : EXPENSE_TYPES;
  const allowedDocs = user.allowed_document_types?.length > 0
    ? DOCUMENT_TYPES.filter(d => user.allowed_document_types.includes(d.v))
    : DOCUMENT_TYPES;

  const [tipo,setTipo]             = useState(editReq?.tipo||defaultTipo);
  const [title,setTitle]           = useState(editReq?.title||'');
  const [desc,setDesc]             = useState(editReq?.description||'');
  const [amount,setAmount]         = useState(editReq?.amount?String(editReq.amount):'');
  const [category,setCategory]     = useState(editReq?.category||'');
  const [chavePix,setChavePix]     = useState(editReq?.chave_pix||'');
  const [favorecido,setFavorecido] = useState(editReq?.favorecido||'');
  const [increaseReason,setIncreaseReason] = useState('');
  const [dueDate,setDueDate]       = useState(editReq?.totvs?.dueDate||'');
  const [document,setDocument]     = useState(editReq?.totvs?.document||allowedDocs[0]?.v||15);
  const [expenses,setExpenses]     = useState(
    editReq?.totvs?.expenses?.length
      ? editReq.totvs.expenses.map(e=>({expenseCode:String(e.expenseCode||''),costCenterCode:String(e.costCenterCode||''),valor:String(e.valor||'')}))
      : [{expenseCode:allowedExpenses.length===1?String(allowedExpenses[0].v):'',costCenterCode:'',valor:''}]
  );
  const addExpense    = () => setExpenses(p=>[...p,{expenseCode:'',costCenterCode:'',valor:''}]);
  const removeExpense = i  => setExpenses(p=>p.filter((_,j)=>j!==i));
  const updateExpense = (i,field,val) => setExpenses(p=>p.map((e,j)=>j===i?{...e,[field]:val}:e));
  const [parcelas,setParcelas]     = useState(editReq?.totvs?.parcelas||1);
  const [parcelasList,setParcelasList] = useState(
    editReq?.totvs?.parcelasList?.length
      ? editReq.totvs.parcelasList.map(p=>({dueDate:p.dueDate||'',valor:String(p.valor||'')}))
      : []
  );
  const setParcelasCount = (nRaw) => {
    const n = parseInt(nRaw)||1;
    setParcelas(n);
    setParcelasList(prev=>{ const arr=prev.slice(0,n); while(arr.length<n) arr.push({dueDate:'',valor:''}); return arr; });
  };
  const updateParcela = (i,field,val) => setParcelasList(p=>p.map((x,j)=>j===i?{...x,[field]:val}:x));
  const [receipts,setReceipts]     = useState(editReq?.receipts||[]);
  const [errors,setErrors]         = useState({});
  const [loading,setLoading]       = useState(false);
  const [centrosCusto,setCentrosCusto] = useState([]);
  const [categorias,setCategorias]     = useState(CATEGORIES);
  useEffect(()=>{
    // Buscas independentes: se uma falhar, a outra ainda carrega. Com 1 retry.
    const carregar = async (tabela, q, setFn, transform) => {
      for(let tent=0; tent<2; tent++){
        try { const d = await sbSelect(tabela, q); if(d&&d.length){ setFn(transform?transform(d):d); } return; }
        catch(e){ if(tent===0) await new Promise(r=>setTimeout(r,600)); }
      }
    };
    carregar('centros_custo','?order=codigo.asc&ativo=eq.true', setCentrosCusto);
    carregar('categorias','?order=nome.asc&ativo=eq.true', setCategorias, d=>d.map(c=>c.nome));
  },[]);
  const fileRef = useRef();

  // Um serviço já convertido em pagamento deve editar os campos de pagamento (TOTVS)
  const isPagamento = tipo === 'pagamento' || !!editReq?.servico_convertido;
  // Edição de pagamento já convertido com valor acima do aprovado → precisa reaprovação do diretor
  const tetoEdit = parseFloat(editReq?.valor_aprovado);
  const isIncreaseEdit = !!editReq?.servico_convertido && !isNaN(tetoEdit) && parseFloat((amount||'').replace(',','.')) > tetoEdit + 0.001;

  const genDuplicateCode = () => genDupCode();

  const handleFiles = e => {
    Array.from(e.target.files).forEach(f=>{
      const r=new FileReader();
      r.onload=ev=>setReceipts(p=>[...p,{name:f.name,data:ev.target.result,type:f.type}]);
      r.readAsDataURL(f);
    });
    e.target.value='';
  };

  const validate = () => {
    const e={};
    if(!title.trim()) e.title = 'Obrigatório';
    if(!amount||isNaN(parseFloat(amount.replace(',','.')))) e.amount = 'Valor inválido';
    if(!desc.trim())  e.desc  = 'Obrigatório';
    if(!category) e.category = 'Selecione';
    // Valor acima do aprovado num pagamento já convertido → precisa de motivo (vai ao diretor reavaliar)
    if(isIncreaseEdit && !increaseReason.trim()) e.increaseReason = 'Informe o motivo do aumento';
    if(isPagamento) {
      const nPar = parseInt(parcelas)||1;
      if(nPar===1){
        if(!dueDate)     e.dueDate = 'Obrigatório';
        else if(dueDate <= localDateStr()) e.dueDate = 'A data de vencimento deve ser posterior a hoje';
      } else {
        if(parcelasList.some(p=>!p.dueDate)) e.parcelas='Informe a data de cada parcela';
        else if(parcelasList.some(p=>p.dueDate <= localDateStr())) e.parcelas='Cada vencimento deve ser posterior a hoje';
        else if(parcelasList.some(p=>!(parseFloat(p.valor)>0))) e.parcelas='Informe o valor de cada parcela';
        else {
          const psum = parcelasList.reduce((s,p)=>s+(parseFloat(p.valor)||0),0);
          const tot = parseFloat(amount.replace(',','.'));
          if(!isNaN(tot)&&Math.abs(psum-tot)>0.01) e.parcelas=`A soma das parcelas (${R(psum)}) deve ser igual ao valor total (${R(tot)})`;
        }
      }
      const expSum = expenses.reduce((s,ex)=>s+(parseFloat(ex.valor)||0),0);
      const totalVal = parseFloat(amount.replace(',','.'));
      if(expenses.some(ex=>!ex.expenseCode)) e.expenseCode='Selecione o tipo de cada despesa';
      if(expenses.some(ex=>!ex.costCenterCode)) e.costCenter='Selecione o centro de custo de cada despesa';
      if(expenses.some(ex=>!(parseFloat(ex.valor)>0)))  e.expenseValor='Informe o valor de cada despesa';
      if(!isNaN(totalVal)&&Math.abs(expSum-totalVal)>0.01) e.expenseSum=`A soma das despesas (${R(expSum)}) deve ser igual ao valor total (${R(totalVal)})`;
      if(!chavePix.trim() && parseInt(document)!==2) e.chavePix = 'Obrigatório';
      if(!favorecido.trim()) e.favorecido = 'Obrigatório';
      if(!receipts.length) e.receipts = 'Anexe ao menos um comprovante';
    }
    return e;
  };

  const submit = () => {
    const e=validate(); if(Object.keys(e).length){setErrors(e);return;}
    setLoading(true);
    const today = localDateStr();
    const val = parseFloat(amount.replace(',','.'));

    if(isPagamento) {
      const nPar = parseInt(parcelas)||1;
      const plist = nPar>1
        ? parcelasList.map(p=>({dueDate:p.dueDate, valor:Math.round((parseFloat(p.valor)||0)*100)/100}))
        : [{dueDate, valor: val}];
      const totvsData = {
        supplierCpfCnpj:    editReq?.totvs?.supplierCpfCnpj||'28171353000173',
        duplicateCode:      isEdit?(editReq.totvs?.duplicateCode||genDuplicateCode()):genDuplicateCode(),
        bearerCode:         editReq?.totvs?.bearerCode||1020,
        issueDate:          today, dueDate: plist[0].dueDate, arrivalDate:today,
        document:           parseInt(document),
        prevision:2, stage:1,
        expenses:           expenses.map(ex=>({expenseCode:parseInt(ex.expenseCode),valor:parseFloat(ex.valor)||0,costCenterCode:parseInt(ex.costCenterCode)||1})),
        observation:        desc.trim(),
        parcelas:           plist.length,
        parcelasList:       plist,
      };
      // Gestor que cria pagamento não tem gestor acima → vai direto ao diretor (sempre, independe do valor)
      const gestorCriador = user.role==='gestor';
      // Aumento acima do aprovado → sempre ao diretor reavaliar (mantém o teto antigo até ele aprovar)
      const payStatus = isIncreaseEdit ? 'pending_diretor' : (gestorCriador ? 'pending_diretor' : 'pending_gestor');
      const payMsg = gestorCriador ? 'ao diretor' : 'para revisão do gestor';
      const payAction = isIncreaseEdit
        ? `Solicitou aumento de ${R(tetoEdit)} para ${R(val)} — reenviado ao diretor para reavaliar`
        : `Solicitação editada e reenviada ${payMsg}`;
      const payComment = isIncreaseEdit ? increaseReason.trim() : '';
      if(isEdit) {
        setTimeout(()=>onSubmit({
          ...editReq, title:title.trim(), description:desc.trim(),
          amount:val, category, receipts, totvs:totvsData, chave_pix:chavePix, favorecido:favorecido.trim(),
          status:payStatus,
          history:[...(editReq.history||[]),{date:fmtDate(),actor:user.name,action:payAction,comment:payComment}]
        }),400);
      } else {
        setTimeout(()=>onSubmit({
          id:String(Date.now()), tipo:'pagamento',
          title:title.trim(), description:desc.trim(),
          amount:val, category, receipts, totvs:totvsData, chave_pix:chavePix, favorecido:favorecido.trim(),
          status:payStatus, solicitanteId:user.id, solicitanteName:user.name,
          created_at:fmtDate(),
          history:[{date:fmtDate(),actor:user.name,action:`Pagamento solicitado e enviado ${payMsg}`,comment:''}]
        }),400);
      }
    } else {
      if(isEdit) {
        // Edição de serviço — destino depende se já foi convertido
        const targetStatus = editReq.servico_convertido ? 'pending_gestor' : 'pending_diretor';
        const actionLabel  = editReq.servico_convertido
          ? 'Serviço editado e reenviado ao gestor'
          : 'Serviço editado e reenviado ao diretor para reavaliar o valor';
        setTimeout(()=>onSubmit({
          ...editReq,
          title:title.trim(), description:desc.trim(),
          amount:val, receipts,
          status:targetStatus,
          // Serviço reenviado ao diretor: zera o valor aprovado (será reaprovado com o novo valor)
          valor_aprovado: editReq.servico_convertido ? editReq.valor_aprovado : null,
          history:[...(editReq.history||[]),{date:fmtDate(),actor:user.name,action:actionLabel,comment:''}]
        }),400);
      } else {
        // Novo serviço: vai direto ao diretor
        setTimeout(()=>onSubmit({
          id:String(Date.now()), tipo:'servico',
          title:title.trim(), description:desc.trim(),
          amount:val, category:category||'Outros', receipts, totvs:{}, chave_pix:'',
          status:'pending_diretor', solicitanteId:user.id, solicitanteName:user.name,
          servico_convertido:false,
          created_at:fmtDate(),
          history:[{date:fmtDate(),actor:user.name,action:'Serviço solicitado — enviado ao diretor para aprovação',comment:''}]
        }),400);
      }
    }
  };

  const F  = 'w-full px-3.5 py-2.5 rounded-xl text-sm transition';
  const FS = (err)=>({background:'#FAF8F5',border:`1px solid ${err?'#EF4444':'var(--line)'}`,color:'var(--ink)'});
  const onF = e=>e.target.style.borderColor='var(--hazelnut)';
  const onB = (err)=>e=>e.target.style.borderColor=err?'#EF4444':'var(--line)';
  const Lbl = ({children,err})=>(
    <label className="block text-xs font-semibold mb-1.5" style={{color:'var(--ink-soft)',letterSpacing:'0.04em'}}>
      {children}{err&&<span style={{color:'var(--hazelnut)'}}> *</span>}
    </label>
  );
