/* ═══════════════════════ SOLICITAÇÕES LIST ═══════════════════════ */
function SolicitacoesView({ user, requests, onSelect, onNew, dispatch, showToast, tipoFilter='pagamentos' }) {
  // Ao entrar, já filtra pelo que está pendente para o próprio papel ("Para Aprovar")
  const filtroInicial = (()=>{
    if(user.role==='diretor') return 'pending_diretor';
    if(user.role==='gestor' && tipoFilter==='pagamentos') return 'pending_gestor';
    if(user.role==='financeiro' && tipoFilter==='pagamentos') return 'pending_financeiro';
    if(user.role==='solicitante') return tipoFilter==='servicos' ? 'servico_aprovado' : 'open';
    return 'all';
  })();
  const [filter,setFilter]=useState(filtroInicial);
  const [search,setSearch]=useState('');
  const [selected,setSelected]=useState(new Set());
  const [bulkLoading,setBulkLoading]=useState(false);
  const [bulkProgress,setBulkProgress]=useState(null);
  const [dueDateFrom,setDueDateFrom]=useState('');
  const [dueDateTo,setDueDateTo]=useState('');
  const [showDateFilter,setShowDateFilter]=useState(false);
  const [sortValor,setSortValor]=useState(null); // null | 'asc' | 'desc'
  const toggleSortValor = ()=>setSortValor(s=> s==='asc' ? 'desc' : 'asc');
  const docLabel = r => { const d=DOCUMENT_TYPES.find(x=>x.v==r.totvs?.document); return d?d.l:'—'; };
  const PAGE_SIZE = 15;
  const [page,setPage] = useState(1);
  // Volta pra 1ª página sempre que muda filtro/busca/ordenação
  useEffect(()=>{ setPage(1); },[filter,search,sortValor,dueDateFrom,dueDateTo,tipoFilter]);

  const isGestorList    = user.role==='gestor';
  const isDiretorList   = user.role==='diretor';
  const isFinanceiroList = user.role==='financeiro';

  let base = requests;
  if(user.role==='solicitante')  base=requests.filter(r=>r.solicitanteId===user.id);
  if(user.role==='gestor'&&user.setor) base=requests.filter(r=>r.setor===user.setor);
  // diretor, financeiro e admin veem todas as solicitações (supervisão do processo);
  // agem apenas quando é a etapa deles (botões só aparecem no status certo).

  // Filtra pelo tipo de lista
  if(tipoFilter==='pagamentos') base=base.filter(r=>r.tipo==='pagamento'||(r.tipo==='servico'&&r.servico_convertido));
  if(tipoFilter==='servicos')   base=base.filter(r=>r.tipo==='servico'&&!r.servico_convertido);

  const filtered = base
    .filter(r=>filter==='all'||r.status===filter)
    .filter(r=>{
      if(!search) return true;
      const s=search.toLowerCase();
      const digits=s.replace(/\D/g,'');
      return r.title.toLowerCase().includes(s)
        || (r.solicitanteName||'').toLowerCase().includes(s)
        || solCode(r).toLowerCase().includes(s)
        || (digits!=='' && String(r.numero||'').includes(digits));
    })
    .filter(r=>{
      if(!dueDateFrom&&!dueDateTo) return true;
      const d = r.totvs?.dueDate||'';
      if(dueDateFrom&&d<dueDateFrom) return false;
      if(dueDateTo&&d>dueDateTo) return false;
      return true;
    });

  const sorted = sortValor
    ? [...filtered].sort((a,b)=> sortValor==='asc' ? (a.amount-b.amount) : (b.amount-a.amount))
    : filtered;

  const totalPages = Math.max(1, Math.ceil(sorted.length/PAGE_SIZE));
  const curPage = Math.min(page, totalPages);
  const pageRows = sorted.slice((curPage-1)*PAGE_SIZE, curPage*PAGE_SIZE);

  const exportPDF = () => {
    const isServ = tipoFilter==='servicos';
    // Serviços: exporta o que está listado; Pagamentos: só pagamentos/serviços convertidos
    const rows = isServ ? sorted.slice() : sorted.filter(r=>r.tipo!=='servico'||r.servico_convertido);
    if(!rows.length){showToast('Nenhum registro para exportar','err');return;}
    const total = rows.reduce((s,r)=>s+r.amount,0);
    const fmtD = v => v?v.split('-').reverse().join('/'):'—';
    const money = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
    const stLabel = s => (STATUS[s]||{}).label || s;
    const titulo = isServ ? 'Relatório de Serviços' : 'Relatório de Pagamentos';
    const head = isServ
      ? `<tr><th>#</th><th>TÍTULO</th><th>SOLICITANTE</th><th>VALOR</th><th>STATUS</th></tr>`
      : `<tr><th>#</th><th>TÍTULO</th><th>TIPO DOCUMENTO</th><th>VALOR</th><th>CHAVE PIX</th><th>FAVORECIDO</th><th>VENCIMENTO</th></tr>`;
    const body = rows.map((r,i)=> isServ
      ? `<tr><td>${i+1}</td><td>${r.title}</td><td>${r.solicitanteName||'—'}</td><td class="val">${money(r.amount)}</td><td>${stLabel(r.status)}</td></tr>`
      : `<tr><td>${i+1}</td><td>${r.title}</td><td>${(()=>{const d=DOCUMENT_TYPES.find(x=>x.v==r.totvs?.document);return d?`${d.v} — ${d.l}`:'—';})()}</td><td class="val">${money(r.amount)}</td><td>${r.chave_pix||'—'}</td><td>${r.favorecido||'—'}</td><td>${fmtD(r.totvs?.dueDate)}</td></tr>`
    ).join('');
    const foot = isServ
      ? `<tr><td colspan="3" class="total">TOTAL</td><td class="val total">${money(total)}</td><td></td></tr>`
      : `<tr><td colspan="3" class="total">TOTAL</td><td class="val total">${money(total)}</td><td colspan="4"></td></tr>`;
    const html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><title>${titulo}</title>
<style>
  body{font-family:Arial,sans-serif;padding:24px;color:#1a1a1a;font-size:12px}
  h1{font-size:18px;margin-bottom:4px}
  .sub{color:#888;margin-bottom:16px;font-size:11px}
  table{width:100%;border-collapse:collapse}
  th{background:#f5f0eb;color:#888;font-size:10px;letter-spacing:.06em;padding:8px 10px;text-align:left;border-bottom:2px solid #e0d9d0}
  td{padding:7px 10px;border-bottom:1px solid #f0ebe5;vertical-align:top}
  .val{color:#c9bbaa;font-weight:700}
  .total{font-weight:700;font-size:13px}
  .foot{margin-top:12px;font-size:10px;color:#aaa}
  @media print{body{padding:0}}
</style></head><body>
<h1>${titulo} — Grupo Deep</h1>
<div class="sub">Gerado em ${new Date().toLocaleString('pt-BR')} · ${rows.length} registro${rows.length!==1?'s':''}</div>
<table><thead>${head}</thead>
<tbody>${body}</tbody>
<tfoot>${foot}</tfoot>
</table>
<div class="foot">Sistema de Pagamentos · Grupo Deep</div>
</body></html>`;
    const w=window.open('','_blank');
    w.document.write(html);
    w.document.close();
    setTimeout(()=>w.print(),400);
  };

  // Quais linhas podem ser selecionadas
  const canSelect = r => (isGestorList&&r.status==='pending_gestor')||(isDiretorList&&r.status==='pending_diretor');
  const eligible  = filtered.filter(canSelect);
  const allSelected = eligible.length>0 && eligible.every(r=>selected.has(r.id));

  const toggleRow = id => setSelected(p=>{ const s=new Set(p); s.has(id)?s.delete(id):s.add(id); return s; });
  const toggleAll = () => setSelected(allSelected ? new Set() : new Set(eligible.map(r=>r.id)));

  /* ── Aprovação em lote: gestor (respeita threshold por item) ── */
  const bulkApproveGestor = () => {
    if(!window.confirm(`Aprovar ${selected.size} solicitação${selected.size!==1?'ões':''}?`)) return;
    const threshold = getThreshold();
    for(const id of [...selected]){
      const r = requests.find(x=>x.id===id);
      if(!r) continue;
      // Serviço não convertido não passa por essa regra; pagamento e serviço convertido seguem o valor limite
      const skipDiretor = (r.tipo==='servico'&&!r.servico_convertido) || (r.amount<threshold);
      const tgt = skipDiretor ? 'pending_financeiro' : 'pending_diretor';
      const lbl = tgt==='pending_diretor'
        ? 'Aprovado em lote pelo gestor — enviado ao diretor'
        : 'Aprovado em lote pelo gestor — enviado ao financeiro';
      dispatch({type:'UPDATE',id,status:tgt,actor:user.name,label:lbl,comment:''});
    }
    showToast(`${selected.size} solicitação${selected.size!==1?'ões':''} aprovada${selected.size!==1?'s':''}!`);
    setSelected(new Set());
  };

  /* ── Aprovação em lote: diretor (respeita o tipo/aumento de cada item) ── */
  const bulkApproveDiretor = () => {
    if(!window.confirm(`Aprovar ${selected.size} solicitação${selected.size!==1?'ões':''}?`)) return;
    for(const id of [...selected]){
      const r = requests.find(x=>x.id===id);
      if(!r) continue;
      const teto = parseFloat(r.valor_aprovado);
      const isInc = !isNaN(teto) && r.amount > teto + 0.001;
      if(r.tipo==='servico' && !r.servico_convertido){
        // Serviço → vira "Serviço Aprovado" (o trigger fotografa o valor aprovado)
        dispatch({type:'UPDATE',id,status:'servico_aprovado',actor:user.name,label:'Serviço aprovado em lote pelo diretor — aguardando execução e conversão',comment:''});
      } else if(isInc){
        // Aumento → novo teto e vai ao gestor verificar
        dispatch({type:'UPDATE',id,status:'pending_gestor',actor:user.name,label:`Aumento aprovado em lote pelo diretor (${R(teto)} → ${R(r.amount)}) — enviado ao gestor`,comment:'',fields:{valor_aprovado:r.amount}});
      } else {
        // Pagamento / serviço convertido → financeiro
        dispatch({type:'UPDATE',id,status:'pending_financeiro',actor:user.name,label:'Aprovado em lote pelo diretor — enviado ao financeiro',comment:''});
      }
    }
    showToast(`${selected.size} solicitação${selected.size!==1?'ões':''} aprovada${selected.size!==1?'s':''}!`);
    setSelected(new Set());
  };

  const FILTERS = [
    {v:'all',l:'Todas'},
    ...(isGestorList&&tipoFilter==='pagamentos'?[{v:'pending_gestor',l:'Para Revisar'}]:[]),
    ...(isDiretorList?[{v:'pending_diretor',l:'Para Aprovar'}]:[]),
    ...(isDiretorList&&tipoFilter==='servicos'?[{v:'servico_aprovado',l:'Serv. Aprovados'}]:[]),
    ...(isFinanceiroList&&tipoFilter==='pagamentos'?[{v:'pending_financeiro',l:'Para Finalizar'}]:[]),
    {v:'open',l:'Devolvidas'},
    ...(tipoFilter==='servicos'?[{v:'servico_aprovado',l:'Serv. Aprovados'}]:[]),
    ...(tipoFilter==='pagamentos'?[{v:'pending_financeiro',l:'No Financeiro'}]:[]),
    ...(tipoFilter==='pagamentos'?[{v:'completed',l:'Concluídas'}]:[]),
    {v:'cancelled',l:'Canceladas'},
  ].filter((f,i,arr)=>arr.findIndex(x=>x.v===f.v)===i); // deduplica

  return (
    <div className="fade">
      <div className="flex items-center justify-between mb-6">
        <div>
          <h1 className="text-xl font-bold" style={{color:'#1A1A1A'}}>{tipoFilter==='servicos'?'Serviços':'Pagamentos'}</h1>
          <p className="text-sm mt-0.5" style={{color:'#888'}}>{filtered.length} registro{filtered.length!==1?'s':''} encontrado{filtered.length!==1?'s':''}</p>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={exportPDF}
            className="flex items-center gap-1.5 px-3 py-2.5 rounded-xl text-sm font-semibold transition-all active:scale-95"
            style={{background:'#fff',border:'1px solid #E0D9D0',color:'#666'}}
            title="Exportar relatório PDF"
            onMouseEnter={e=>{e.currentTarget.style.borderColor='#C9BBAA';e.currentTarget.style.color='#1A1A1A';}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor='#E0D9D0';e.currentTarget.style.color='#666';}}>
            <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.8"><path strokeLinecap="round" d="M7 21H17a2 2 0 002-2V9.414a1 1 0 00-.293-.707L13.293 3.293A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2zM9 15h6m-6-4h6m-2-4h2"/></svg>
            PDF
          </button>
          {user.role==='solicitante' && (
            <button onClick={onNew} className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold transition-all active:scale-95" style={{background:'#282425',color:'#C9BBAA'}}>
              <I.plus/> Nova
            </button>
          )}
        </div>
      </div>

      {/* Search + Filters */}
      <div className="flex flex-col sm:flex-row gap-3 mb-3">
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar por código, título ou solicitante..."
          className="flex-1 px-4 py-2.5 rounded-xl text-sm" style={{background:'#fff',border:'1px solid #E0D9D0',color:'#1A1A1A'}}
          onFocus={e=>e.target.style.borderColor='#C9BBAA'} onBlur={e=>e.target.style.borderColor='#E0D9D0'}/>
        <div className="flex gap-1.5 flex-wrap">
          <button onClick={()=>setShowDateFilter(p=>!p)}
            className="px-3 py-1.5 rounded-xl text-xs font-semibold transition whitespace-nowrap flex items-center gap-1"
            style={{background:(dueDateFrom||dueDateTo)?'#282425':'#fff',color:(dueDateFrom||dueDateTo)?'#C9BBAA':'#888',border:`1px solid ${(dueDateFrom||dueDateTo)?'#282425':'#E0D9D0'}`}}>
            <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path strokeLinecap="round" d="M16 2v4M8 2v4M3 10h18"/></svg>
            Vencimento{(dueDateFrom||dueDateTo)?` ●`:''}
          </button>
          {FILTERS.map(f=>(
            <button key={f.v} onClick={()=>setFilter(f.v)}
              className="px-3 py-1.5 rounded-xl text-xs font-semibold transition whitespace-nowrap"
              style={{background:filter===f.v?'#282425':'#fff',color:filter===f.v?'#C9BBAA':'#888',border:`1px solid ${filter===f.v?'#282425':'#E0D9D0'}`}}>
              {f.l}
            </button>
          ))}
        </div>
      </div>

      {/* Filtro de vencimento expandido */}
      {showDateFilter&&(
        <div className="flex flex-wrap items-center gap-3 mb-4 px-4 py-3 rounded-xl" style={{background:'#fff',border:'1px solid #EDE8E3',position:'relative',zIndex:10}}>
          <span className="text-xs font-semibold" style={{color:'#888',letterSpacing:'0.06em'}}>VENCIMENTO</span>
          <div className="flex items-center gap-2">
            <label className="text-xs" style={{color:'#AAA'}}>De</label>
            <input type="date" value={dueDateFrom} onChange={e=>setDueDateFrom(e.target.value)}
              style={{background:'#FAFAF8',border:'1px solid #E0D9D0',color:'#1A1A1A',
                      borderRadius:'8px',padding:'6px 10px',fontSize:'13px',
                      minWidth:'150px',cursor:'pointer',outline:'none'}}/>
          </div>
          <div className="flex items-center gap-2">
            <label className="text-xs" style={{color:'#AAA'}}>Até</label>
            <input type="date" value={dueDateTo} onChange={e=>setDueDateTo(e.target.value)}
              style={{background:'#FAFAF8',border:'1px solid #E0D9D0',color:'#1A1A1A',
                      borderRadius:'8px',padding:'6px 10px',fontSize:'13px',
                      minWidth:'150px',cursor:'pointer',outline:'none'}}/>
          </div>
          {(dueDateFrom||dueDateTo)&&(
            <button onClick={()=>{setDueDateFrom('');setDueDateTo('');}}
              className="text-xs px-3 py-1.5 rounded-lg transition"
              style={{color:'#DC2626',background:'#FEF2F2'}}>
              Limpar
            </button>
          )}
        </div>
      )}

      {/* Table header (desktop) */}
      <div className="hidden md:grid gap-3 px-4 py-2.5 mb-2 text-xs font-bold" style={{color:'#9A928A',letterSpacing:'0.08em',background:'#FAF7F3',border:'1px solid #EFE7DC',borderRadius:'12px',gridTemplateColumns:(isGestorList||isDiretorList)?'24px 64px minmax(0,1.9fr) minmax(0,1fr) 120px 130px 100px 150px 28px':'64px minmax(0,1.9fr) minmax(0,1fr) 120px 130px 100px 150px 28px'}}>
        {(isGestorList||isDiretorList)&&(
          <input type="checkbox" checked={allSelected} onChange={toggleAll} style={{accentColor:'#282425',cursor:'pointer'}} title="Selecionar todas elegíveis"/>
        )}
        <div>CÓDIGO</div>
        <div>TÍTULO</div>
        <div>SOLICITANTE</div>
        <div>DOCUMENTO</div>
        <div className="flex items-center justify-start gap-1 cursor-pointer select-none" onClick={toggleSortValor} title="Ordenar por valor">
          <span>VALOR</span>
          <span style={{color:sortValor?'#8A6248':'#CBC3B8',fontSize:'11px'}}>{sortValor==='asc'?'▲':sortValor==='desc'?'▼':'⇅'}</span>
        </div>
        <div>VENCIMENTO</div>
        <div>STATUS</div>
        <div/>
      </div>

      {/* Rows */}
      {sorted.length===0?(
        <div className="rounded-2xl p-12 text-center" style={{background:'#fff',border:'1px solid #EDE8E3'}}>
          <svg width="36" height="36" className="mx-auto mb-3" fill="none" viewBox="0 0 24 24" style={{color:'#E0D9D0'}}>
            <path d="M9 12h6m-6 4h6M9 8h3M5 3h11l3 3v15a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
          </svg>
          <p className="text-sm font-medium" style={{color:'#AAA'}}>Nenhuma solicitação encontrada</p>
        </div>
      ):(
        <div className="space-y-1.5">
          {pageRows.map(r=>(
            <div key={r.id}
              className="rounded-xl transition-all"
              style={{background: selected.has(r.id)?'#FAFAF7':'#fff', border:`1px solid ${selected.has(r.id)?'#C9BBAA':'#EDE8E3'}`, borderLeft:`3px solid ${(STATUS[r.status]||{}).dot||'#E0D9D0'}`}}
              onMouseEnter={e=>{if(!selected.has(r.id)){e.currentTarget.style.borderColor='#C9BBAA';e.currentTarget.style.borderLeftColor=(STATUS[r.status]||{}).dot||'#E0D9D0';e.currentTarget.style.boxShadow='0 2px 12px rgba(0,0,0,.06)'}}}
              onMouseLeave={e=>{if(!selected.has(r.id)){e.currentTarget.style.borderColor='#EDE8E3';e.currentTarget.style.borderLeftColor=(STATUS[r.status]||{}).dot||'#E0D9D0';e.currentTarget.style.boxShadow='none'}}}>
              {/* Desktop row */}
              <div className="hidden md:grid gap-3 px-4 py-3.5 items-center"
                style={{gridTemplateColumns:(isGestorList||isDiretorList)?'24px 64px minmax(0,1.9fr) minmax(0,1fr) 120px 130px 100px 150px 28px':'64px minmax(0,1.9fr) minmax(0,1fr) 120px 130px 100px 150px 28px'}}>
                {(isGestorList||isDiretorList)&&(
                  <input type="checkbox"
                    checked={selected.has(r.id)}
                    disabled={!canSelect(r)}
                    onChange={e=>{e.stopPropagation();toggleRow(r.id);}}
                    onClick={e=>e.stopPropagation()}
                    style={{accentColor:'#282425',cursor:canSelect(r)?'pointer':'default',opacity:canSelect(r)?1:0.25}}/>
                )}
                <div className="cursor-pointer" onClick={()=>onSelect(r.id)}>
                  <span style={{display:'inline-block',minWidth:'48px',textAlign:'center',padding:'4px 8px',borderRadius:'8px',background:'#F3EDE4',color:'#8A6248',fontWeight:700,fontSize:'12px',letterSpacing:'0.03em'}}>{solCode(r)}</span>
                </div>
                <div className="cursor-pointer min-w-0" onClick={()=>onSelect(r.id)}>
                  <p className="text-sm font-semibold truncate" style={{color:'#1A1A1A'}}>{r.title}</p>
                </div>
                <div className="text-sm truncate cursor-pointer" style={{color:'#666'}} onClick={()=>onSelect(r.id)}>{r.solicitanteName}</div>
                <div className="text-xs truncate cursor-pointer" style={{color:'#888'}} onClick={()=>onSelect(r.id)} title={docLabel(r)}>{docLabel(r)}</div>
                <div className="text-sm font-bold cursor-pointer" style={{color:'#C9BBAA'}} onClick={()=>onSelect(r.id)}>{R(r.amount)}</div>
                <div className="text-xs cursor-pointer" style={{color:'#888'}} onClick={()=>onSelect(r.id)}>
                  {r.totvs?.dueDate?r.totvs.dueDate.split('-').reverse().join('/'):'—'}
                </div>
                <div className="flex justify-start cursor-pointer" onClick={()=>onSelect(r.id)}><Badge status={r.status}/></div>
                <div className="flex justify-end cursor-pointer" style={{color:'#CCC'}} onClick={()=>onSelect(r.id)}><I.chevron/></div>
              </div>
              {/* Mobile card */}
              <div className="md:hidden p-4 flex gap-3 items-start" onClick={()=>onSelect(r.id)}>
                {(isGestorList||isDiretorList)&&canSelect(r)&&(
                  <input type="checkbox" checked={selected.has(r.id)}
                    onChange={e=>{e.stopPropagation();toggleRow(r.id);}}
                    onClick={e=>e.stopPropagation()}
                    style={{accentColor:'#282425',marginTop:'3px',flexShrink:0}}/>
                )}
                <div className="flex-1 min-w-0">
                  <div className="flex items-start justify-between gap-2 mb-2">
                    <p className="text-sm font-semibold" style={{color:'#1A1A1A'}}>{r.title}</p>
                    <span className="text-sm font-bold flex-shrink-0" style={{color:'#C9BBAA'}}>{R(r.amount)}</span>
                  </div>
                  <div className="flex items-center gap-2 flex-wrap">
                    <Badge status={r.status}/>
                    <span className="text-xs" style={{color:'#AAA'}}>{[solCode(r),docLabel(r),r.solicitanteName].filter(Boolean).join(' · ')}</span>
                  </div>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Paginação */}
      {sorted.length>PAGE_SIZE && (
        <div className="flex items-center justify-between gap-3 mt-4 flex-wrap">
          <span className="text-xs" style={{color:'#AAA'}}>
            Mostrando {(curPage-1)*PAGE_SIZE+1}–{Math.min(curPage*PAGE_SIZE,sorted.length)} de {sorted.length}
          </span>
          <div className="flex items-center gap-1.5">
            <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={curPage<=1}
              className="px-3 py-1.5 rounded-lg text-xs font-semibold disabled:opacity-40 disabled:cursor-default"
              style={{background:'#fff',border:'1px solid #EDE8E3',color:'#666'}}>‹ Anterior</button>
            <span className="text-xs px-2" style={{color:'#666'}}>Página {curPage} de {totalPages}</span>
            <button onClick={()=>setPage(p=>Math.min(totalPages,p+1))} disabled={curPage>=totalPages}
              className="px-3 py-1.5 rounded-lg text-xs font-semibold disabled:opacity-40 disabled:cursor-default"
              style={{background:'#fff',border:'1px solid #EDE8E3',color:'#666'}}>Próxima ›</button>
          </div>
        </div>
      )}

      {/* Barra flutuante de aprovação em lote */}
      {selected.size>0&&(
        <div className="fixed bottom-6 left-1/2 z-50 fade flex items-center gap-3 px-5 py-3 rounded-2xl shadow-2xl"
          style={{transform:'translateX(-50%)',background:'#282425',border:'1px solid #2A2A2A'}}>
          <span className="text-sm font-semibold" style={{color:'#C9BBAA'}}>
            {selected.size} selecionada{selected.size!==1?'s':''}
          </span>
          <div className="w-px h-4 flex-shrink-0" style={{background:'#333'}}/>
          <button
            onClick={isGestorList?bulkApproveGestor:bulkApproveDiretor}
            disabled={bulkLoading}
            className="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold transition-all active:scale-95 disabled:opacity-60"
            style={{background:'#C9BBAA',color:'#282425'}}>
            {bulkLoading
              ? <><svg className="spin w-4 h-4" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#282425" strokeWidth="3" strokeDasharray="60" strokeDashoffset="15"/></svg>
                  Processando...</>
              : <><I.check/> Aprovar {selected.size}</>
            }
          </button>
          <button onClick={()=>setSelected(new Set())} disabled={bulkLoading}
            className="text-xs px-3 py-2 rounded-xl transition disabled:opacity-40"
            style={{color:'#666'}}>
            Cancelar
          </button>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════ ADMIN VIEW ═══════════════════════ */
function AdminView({ showToast }) {
  const [adminTab,setAdminTab] = useState('usuarios');
  const [users,setUsers]=useState([]);
  const [setores,setSetores]=useState([]);
  const [categorias,setCategorias]=useState([]);
  const [centrosCusto,setCentrosCusto]=useState([]);
  const [tiposDespesa,setTiposDespesa]=useState([]);
  const [tiposDocumento,setTiposDocumento]=useState([]);
  const [loading,setLoading]=useState(true);
  const [modal,setModal]=useState(null);
  const [saving,setSaving]=useState(false);
  const [thresholdEdit,setThresholdEdit]=useState(String(getThreshold()));
  const [thresholdSaved,setThresholdSaved]=useState(false);

  // New-item inputs per tab
  const [newCat,setNewCat]=useState('');
  const [newCC,setNewCC]=useState({codigo:'',nome:''});
  const [newDespesa,setNewDespesa]=useState({codigo:'',descricao:''});
  const [newDoc,setNewDoc]=useState({codigo:'',descricao:''});
  const [addLoading,setAddLoading]=useState(false);

  const load = async () => {
    setLoading(true);
    try {
      const [usersData, setoresData, catsData, ccData, despData, docData] = await Promise.all([
        sbSelect('profiles','?order=created_at.asc'),
        sbSelect('setores','?order=nome.asc'),
        sbSelect('categorias','?order=nome.asc'),
        sbSelect('centros_custo','?order=codigo.asc'),
        sbSelect('tipos_despesa','?order=codigo.asc'),
        sbSelect('tipos_documento','?order=codigo.asc'),
      ]);
      setUsers(usersData||[]);
      setSetores((setoresData||[]).map(s=>s.nome));
      setCategorias(catsData||[]);
      setCentrosCusto(ccData||[]);
      setTiposDespesa(despData||[]);
      setTiposDocumento(docData||[]);
    } catch(e){ showToast('Erro ao carregar dados','err'); }
    setLoading(false);
  };
  useEffect(()=>{load();},[]);

  const addSetor = async (nome) => {
    try {
      await sbInsert('setores',{nome});
      setSetores(p=>[...p,nome].sort((a,b)=>a.localeCompare(b)));
    } catch(e){ showToast('Erro ao criar setor','err'); throw e; }
  };

  const toggleActive = async (u) => {
    try {
      await sbAdminUsers('toggle',{ id:u.id, is_active:!u.is_active });
      setUsers(p=>p.map(x=>x.id===u.id?{...x,is_active:!x.is_active}:x));
      showToast(u.is_active?'Usuário desativado':'Usuário reativado');
    } catch(e){ showToast(e.message||'Erro ao atualizar','err'); }
  };

  const deleteUser = async (u) => {
    if(!confirm(`Excluir ${u.name}?`)) return;
    try {
      await sbAdminUsers('delete',{ id:u.id });
      setUsers(p=>p.filter(x=>x.id!==u.id));
      showToast('Usuário removido');
    } catch(e){ showToast(e.message||'Erro ao remover','err'); }
  };

  const toggleRow = async (table, row, setFn, pkField='id') => {
    try {
      const newVal = !row.ativo;
      await sbUpdate(table,{ativo:newVal},`?${pkField}=eq.${row[pkField]}`);
      setFn(p=>p.map(x=>x[pkField]===row[pkField]?{...x,ativo:newVal}:x));
      showToast(newVal?'Ativado':'Desativado');
    } catch{ showToast('Erro ao atualizar','err'); }
  };

  const ROLE_COLOR = {admin:'#8B5CF6',gestor:'#3B82F6',diretor:'#F59E0B',financeiro:'#22C55E',solicitante:'#888'};

  const saveThreshold = async () => {
    const v = parseFloat(thresholdEdit.replace(',','.'));
    if(isNaN(v)||v<=0){showToast('Valor inválido','err');return;}
    setThreshold(v);
    try {
      await sbUpsert('configuracoes',{chave:'threshold',valor:String(v),updated_at:new Date().toISOString()});
    } catch(e){ showToast('Aviso: erro ao salvar no banco','err'); }
    setThresholdSaved(true);
    setTimeout(()=>setThresholdSaved(false),2000);
    showToast(`Threshold atualizado para ${new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v)}!`);
  };

  const inp = 'w-full px-3 py-2.5 rounded-xl text-sm';
  const is  = {background:'#FAFAF8',border:'1px solid #E0D9D0',color:'#1A1A1A'};
  const isE = e => ({background:'#FAFAF8',border:`1px solid ${e?'#EF4444':'#E0D9D0'}`,color:'#1A1A1A'});

  const TABS = [
    {id:'usuarios', label:'Usuários'},
    {id:'categorias', label:'Categorias'},
    {id:'centros', label:'Centros de Custo'},
    {id:'despesas', label:'Tipos Despesa'},
    {id:'documentos', label:'Tipos Documento'},
    {id:'config', label:'Configurações'},
  ];

  // Generic list manager component (inline)
  const ListManager = ({items,onToggle,renderRow,addForm}) => (
    <div>
      {addForm}
      <div className="mt-4 space-y-2">
        {loading?<div className="flex items-center justify-center py-8"><Spinner/></div>
        :items.length===0?<p className="text-sm text-center py-6" style={{color:'#AAA'}}>Nenhum item cadastrado</p>
        :items.map((item,i)=>renderRow(item,i))}
      </div>
    </div>
  );

  return (
    <div className="fade">
      {/* Tab bar */}
      <div className="flex gap-1 mb-6 flex-wrap">
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setAdminTab(t.id)}
            className="px-4 py-2 rounded-xl text-sm font-semibold transition-all"
            style={{background:adminTab===t.id?'#282425':'#fff',color:adminTab===t.id?'#C9BBAA':'#888',border:`1px solid ${adminTab===t.id?'#282425':'#EDE8E3'}`}}>
            {t.label}
          </button>
        ))}
      </div>

      {/* ── USUÁRIOS ── */}
      {adminTab==='usuarios'&&(<>
        <div className="flex items-center justify-between mb-6">
          <div>
            <h1 className="text-xl font-bold" style={{color:'#1A1A1A'}}>Usuários</h1>
            <p className="text-sm mt-0.5" style={{color:'#888'}}>{users.length} usuário{users.length!==1?'s':''} cadastrado{users.length!==1?'s':''}</p>
          </div>
          <button onClick={()=>setModal('new')}
            className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold transition-all active:scale-95"
            style={{background:'#282425',color:'#C9BBAA'}}>
            <I.plus/> Novo Usuário
          </button>
        </div>

/* ═══════════════════════ USER MODAL ═══════════════════════ */
function UserModal({ user, onClose, onSave, saving, setores=[], onAddSetor }) {
  const [name,setName]   = useState(user?.name||'');
  const [email,setEmail] = useState(user?.email||'');
  const [pw,setPw]       = useState('');
  const [role,setRole]   = useState(user?.role||'solicitante');
  const [setor,setSetor] = useState(user?.setor||'');
  const [novoSetor,setNovoSetor] = useState('');
  const [criandoSetor,setCriandoSetor] = useState(false);
  const [restrictExp,setRestrictExp] = useState((user?.allowed_expense_codes?.length||0)>0);
  const [selExp,setSelExp] = useState(new Set(user?.allowed_expense_codes||[]));
  const [restrictDoc,setRestrictDoc] = useState((user?.allowed_document_types?.length||0)>0);
  const [selDoc,setSelDoc] = useState(new Set(user?.allowed_document_types||[]));
  const [expSearch,setExpSearch] = useState('');
  const [mustChange,setMustChange] = useState(!!user?.must_change_password);
  const [tab,setTab] = useState('info'); // 'info' | 'exp' | 'doc'

  const toggleExp = v => setSelExp(p=>{ const s=new Set(p); s.has(v)?s.delete(v):s.add(v); return s; });
  const toggleDoc = v => setSelDoc(p=>{ const s=new Set(p); s.has(v)?s.delete(v):s.add(v); return s; });

  const submit = () => {
    if(!name.trim()||!email.trim()){alert('Nome e email obrigatórios');return;}
    if(!user&&!pw.trim()){alert('Senha obrigatória para novo usuário');return;}
    onSave({
      name:name.trim(), email:email.trim().toLowerCase(), password:pw,
      role, setor:setor.trim(),
      allowed_expense_codes: restrictExp?[...selExp]:[],
      allowed_document_types: restrictDoc?[...selDoc]:[],
      must_change_password: mustChange,
    });
  };

  const filteredExp = EXPENSE_TYPES.filter(e=>
    !expSearch || e.l.toLowerCase().includes(expSearch.toLowerCase()) || String(e.v).includes(expSearch));

  const inp = 'w-full px-3 py-2.5 rounded-xl text-sm';
  const is  = {background:'#FAFAF8',border:'1px solid #E0D9D0',color:'#1A1A1A'};
  const Lbl = ({c})=><label className="block text-xs font-semibold mb-1.5" style={{color:'#888',letterSpacing:'0.06em'}}>{c}</label>;

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 overlay" style={{background:'rgba(0,0,0,.5)'}}>
      <div className="w-full max-w-lg rounded-2xl slide-up flex flex-col" style={{background:'#fff',maxHeight:'90vh'}}>
        {/* Header */}
        <div className="flex items-center justify-between px-5 py-4" style={{borderBottom:'1px solid #EDE8E3'}}>
          <p className="font-bold" style={{color:'#1A1A1A'}}>{user?'Editar Usuário':'Novo Usuário'}</p>
          <button onClick={onClose} className="w-8 h-8 rounded-xl flex items-center justify-center text-lg hover:bg-gray-100" style={{color:'#AAA'}}>✕</button>
        </div>

        {/* Tabs */}
        <div className="flex px-5 pt-4 gap-1">
          {[['info','Dados'],['exp','Despesas'],['doc','Documentos']].map(([id,l])=>(
            <button key={id} onClick={()=>setTab(id)}
              className="px-4 py-1.5 rounded-lg text-xs font-semibold transition"
              style={{background:tab===id?'#282425':'#F5F0EB',color:tab===id?'#C9BBAA':'#888'}}>
              {l}{id==='exp'&&restrictExp&&selExp.size>0&&<span className="ml-1 text-xs opacity-70">({selExp.size})</span>}
              {id==='doc'&&restrictDoc&&selDoc.size>0&&<span className="ml-1 text-xs opacity-70">({selDoc.size})</span>}
            </button>
          ))}
        </div>

        {/* Body */}
        <div className="overflow-y-auto flex-1 px-5 pb-4 pt-4 space-y-3">
          {tab==='info'&&(<>
            <div className="grid grid-cols-2 gap-3">
              <div><Lbl c="NOME"/><input value={name} onChange={e=>setName(e.target.value)} className={inp} style={is} onFocus={e=>e.target.style.borderColor='#C9BBAA'} onBlur={e=>e.target.style.borderColor='#E0D9D0'}/></div>
              <div><Lbl c="FUNÇÃO"/>
                <select value={role} onChange={e=>setRole(e.target.value)} className={inp} style={{...is,appearance:'none'}} onFocus={e=>e.target.style.borderColor='#C9BBAA'} onBlur={e=>e.target.style.borderColor='#E0D9D0'}>
                  {Object.entries(ROLE_LABELS).map(([v,l])=><option key={v} value={v}>{l}</option>)}
                </select>
              </div>
            </div>
            <div><Lbl c="EMAIL"/><input type="email" value={email} onChange={e=>setEmail(e.target.value)} className={inp} style={is} onFocus={e=>e.target.style.borderColor='#C9BBAA'} onBlur={e=>e.target.style.borderColor='#E0D9D0'}/></div>
            <div><Lbl c="SETOR"/>
              {criandoSetor?(
                <div className="flex gap-2">
                  <input value={novoSetor} onChange={e=>setNovoSetor(e.target.value)}
                    placeholder="Nome do novo setor..."
                    className={inp+" flex-1"} style={is}
                    onKeyDown={async e=>{if(e.key==='Enter'){e.preventDefault();if(!novoSetor.trim())return;try{await onAddSetor(novoSetor.trim());setSetor(novoSetor.trim());setNovoSetor('');setCriandoSetor(false);}catch(err){}}}}
                    onFocus={e=>e.target.style.borderColor='#C9BBAA'} onBlur={e=>e.target.style.borderColor='#E0D9D0'}
                    autoFocus/>
                  <button type="button" onClick={async()=>{if(!novoSetor.trim())return;try{await onAddSetor(novoSetor.trim());setSetor(novoSetor.trim());setNovoSetor('');setCriandoSetor(false);}catch(err){}}}
                    className="px-3 py-2 rounded-xl text-sm font-semibold" style={{background:'#282425',color:'#C9BBAA'}}>✓</button>
                  <button type="button" onClick={()=>{setCriandoSetor(false);setNovoSetor('');}}
                    className="px-3 py-2 rounded-xl text-sm" style={{background:'#F5F0EB',color:'#888'}}>✕</button>
                </div>
              ):(
                <select value={setor} onChange={e=>{if(e.target.value==='__new__'){setCriandoSetor(true);}else{setSetor(e.target.value);}}}
                  className={inp} style={{...is,appearance:'none'}}
                  onFocus={e=>e.target.style.borderColor='#C9BBAA'} onBlur={e=>e.target.style.borderColor='#E0D9D0'}>
                  <option value="">— Selecione o setor —</option>
                  {setores.map(s=><option key={s} value={s}>{s}</option>)}
                  <option value="__new__">＋ Criar novo setor</option>
                </select>
              )}
            </div>
            <div><Lbl c={user?'NOVA SENHA (deixe em branco para não alterar)':'SENHA PROVISÓRIA'}/>
              <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder={user?'••••••':''} className={inp} style={is} onFocus={e=>e.target.style.borderColor='#C9BBAA'} onBlur={e=>e.target.style.borderColor='#E0D9D0'}/></div>
            <label className="flex items-start gap-2.5 p-3 rounded-xl cursor-pointer" style={{background:'#F7F3EE',border:'1px solid #EDE8E3'}}>
              <input type="checkbox" checked={mustChange} onChange={e=>setMustChange(e.target.checked)} className="mt-0.5" style={{accentColor:'#0A0A0A'}}/>
              <span>
                <span className="text-sm font-semibold block" style={{color:'#1A1A1A'}}>Exigir troca de senha no 1º acesso</span>
                <span className="text-xs" style={{color:'#888'}}>O usuário define a própria senha ao entrar. Você informa só a senha provisória e não fica sabendo a definitiva.</span>
              </span>
            </label>
          </>)}

          {tab==='exp'&&(<>
            <div className="flex items-center justify-between p-3 rounded-xl" style={{background:'#F7F3EE',border:'1px solid #EDE8E3'}}>
              <div>
                <p className="text-sm font-semibold" style={{color:'#1A1A1A'}}>Restringir códigos de despesa</p>
                <p className="text-xs mt-0.5" style={{color:'#AAA'}}>Desativado = todas liberadas</p>
              </div>
              <button onClick={()=>setRestrictExp(p=>!p)}
                className="w-11 h-6 rounded-full transition-all relative"
                style={{background:restrictExp?'#282425':'#E0D9D0'}}>
                <span className="absolute top-1 w-4 h-4 bg-white rounded-full transition-all shadow-sm"
                  style={{left:restrictExp?'calc(100% - 20px)':'4px'}}/>
              </button>
            </div>
            {restrictExp&&(<>
              <input value={expSearch} onChange={e=>setExpSearch(e.target.value)} placeholder="Buscar despesa..."
                className={inp} style={{...is,marginBottom:'4px'}} onFocus={e=>e.target.style.borderColor='#C9BBAA'} onBlur={e=>e.target.style.borderColor='#E0D9D0'}/>
              <div className="rounded-xl overflow-y-auto space-y-0.5" style={{maxHeight:'220px',border:'1px solid #EDE8E3'}}>
                {filteredExp.map(e=>(
                  <label key={e.v} className="flex items-center gap-3 px-3 py-2 cursor-pointer hover:bg-gray-50 transition">
                    <input type="checkbox" checked={selExp.has(e.v)} onChange={()=>toggleExp(e.v)}
                      className="rounded" style={{accentColor:'#282425'}}/>
                    <span className="text-xs" style={{color:'#1A1A1A'}}><span style={{color:'#AAA',marginRight:'4px'}}>{e.v}</span>{e.l}</span>
                  </label>
                ))}
              </div>
              <p className="text-xs text-right" style={{color:'#AAA'}}>{selExp.size} selecionado{selExp.size!==1?'s':''}</p>
            </>)}
          </>)}

          {tab==='doc'&&(<>
            <div className="flex items-center justify-between p-3 rounded-xl" style={{background:'#F7F3EE',border:'1px solid #EDE8E3'}}>
              <div>
                <p className="text-sm font-semibold" style={{color:'#1A1A1A'}}>Restringir tipos de documento</p>
                <p className="text-xs mt-0.5" style={{color:'#AAA'}}>Desativado = todos liberados</p>
              </div>
              <button onClick={()=>setRestrictDoc(p=>!p)}
                className="w-11 h-6 rounded-full transition-all relative"
                style={{background:restrictDoc?'#282425':'#E0D9D0'}}>
                <span className="absolute top-1 w-4 h-4 bg-white rounded-full transition-all shadow-sm"
                  style={{left:restrictDoc?'calc(100% - 20px)':'4px'}}/>
              </button>
            </div>
            {restrictDoc&&(
              <div className="rounded-xl overflow-y-auto space-y-0.5" style={{maxHeight:'260px',border:'1px solid #EDE8E3'}}>
                {DOCUMENT_TYPES.map(d=>(
                  <label key={d.v} className="flex items-center gap-3 px-3 py-2 cursor-pointer hover:bg-gray-50 transition">
                    <input type="checkbox" checked={selDoc.has(d.v)} onChange={()=>toggleDoc(d.v)}
                      style={{accentColor:'#282425'}}/>
                    <span className="text-xs" style={{color:'#1A1A1A'}}><span style={{color:'#AAA',marginRight:'4px'}}>{d.v}</span>{d.l}</span>
                  </label>
                ))}
              </div>
            )}
          </>)}
        </div>

        {/* Footer */}
        <div className="px-5 py-4 flex gap-2" style={{borderTop:'1px solid #EDE8E3'}}>
          <button onClick={onClose} className="flex-1 py-2.5 rounded-xl text-sm font-medium"
            style={{border:'1px solid #E0D9D0',color:'#666'}}>Cancelar</button>
          <button onClick={submit} disabled={saving}
            className="flex-1 py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 disabled:opacity-60"
            style={{background:'#282425',color:'#C9BBAA'}}>
            {saving?<><Spinner/>Salvando...</>:'Salvar'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════ TROCA DE SENHA NO 1º ACESSO ═══════════════════════ */
function ForcePasswordChange({ user, onDone, onLogout }) {
  const [pw,setPw]=useState('');
  const [pw2,setPw2]=useState('');
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);
  const go = async () => {
    if(pw.length<6){setErr('A senha deve ter ao menos 6 caracteres');return;}
    if(pw!==pw2){setErr('As senhas não conferem');return;}
    setLoading(true); setErr('');
    try {
      await sbAdminUsers('set_own_password',{ password: pw });
      onDone();
    } catch(e){ setErr(e.message||'Erro ao salvar a senha'); setLoading(false); }
  };
  const inp='w-full px-4 py-3 rounded-xl text-sm transition';
  const is={background:'#211D1E',border:'1px solid #3A3536',color:'#EAE3DA'};
  return (
    <div className="min-h-screen flex items-center justify-center p-6" style={{background:'radial-gradient(1200px 600px at 50% -10%, #332E2F 0%, #282425 55%, #201C1D 100%)'}}>
      <div className="w-full max-w-sm fade">
        <div className="text-center mb-8">
          <DeepLogo variant="login"/>
          <div className="flex items-center justify-center gap-2.5 mt-5">
            <span style={{height:'1px',width:'26px',background:'#4A4442'}}/>
            <span style={{color:'#9A928A',fontSize:'11px',letterSpacing:'0.18em',textTransform:'uppercase'}}>Primeiro acesso</span>
            <span style={{height:'1px',width:'26px',background:'#4A4442'}}/>
          </div>
        </div>
        <div className="rounded-2xl p-7" style={{background:'rgba(42,38,39,0.6)',border:'1px solid #3A3536',backdropFilter:'blur(8px)'}}>
          <p className="text-sm font-semibold mb-1" style={{color:'var(--bone)'}}>Olá, {user.name?.split(' ')[0]||''}</p>
          <p className="text-xs mb-5" style={{color:'#9A928A'}}>Defina uma senha pessoal para continuar. Só você a conhecerá.</p>
          <div className="space-y-4">
            <div>
              <label className="block text-xs font-medium mb-2" style={{color:'#9A928A'}}>Nova senha</label>
              <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="Mínimo 6 caracteres"
                className={inp} style={is} onFocus={e=>e.target.style.borderColor='var(--hazelnut)'} onBlur={e=>e.target.style.borderColor='#3A3536'}/>
            </div>
            <div>
              <label className="block text-xs font-medium mb-2" style={{color:'#9A928A'}}>Confirmar nova senha</label>
              <input type="password" value={pw2} onChange={e=>setPw2(e.target.value)} placeholder="Repita a senha"
                onKeyDown={e=>e.key==='Enter'&&go()}
                className={inp} style={is} onFocus={e=>e.target.style.borderColor='var(--hazelnut)'} onBlur={e=>e.target.style.borderColor='#3A3536'}/>
            </div>
            {err&&<div className="flex items-center gap-2 text-xs rounded-lg px-3 py-2.5" style={{background:'rgba(220,38,38,0.12)',border:'1px solid rgba(220,38,38,0.25)',color:'#F0A0A0'}}><I.alert/>{err}</div>}
            <button onClick={go} disabled={loading}
              className="w-full py-3 rounded-xl text-sm font-semibold mt-1 transition-all active:scale-[0.98] flex items-center justify-center gap-2 disabled:opacity-60"
              style={{background:'var(--bone)',color:'var(--noir)'}}>
              {loading?<><Spinner/>Salvando...</>:'Salvar e entrar'}
            </button>
            <button onClick={onLogout} className="w-full text-xs py-1" style={{color:'#6B655E'}}>Sair</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════ APP ═══════════════════════ */
function App() {
  const [user,setUser]=useState(null);
  const [view,setView]=useState('dashboard');
  const [listView,setListView]=useState('pagamentos');
  const [selected,setSelected]=useState(null);
  const [editingReq,setEditingReq]=useState(null);
  const [toast,setToast]=useState(null);
  const [menuOpen,setMenuOpen]=useState(false);
  const [appLoading,setAppLoading]=useState(false);
  const [requests,dispatch]=useReducer(reducer,[]);

  const showToast=(msg,type='ok')=>{setToast({msg,type});setTimeout(()=>setToast(null),3500);};

  // Carrega o threshold do banco (após login, pois o RLS exige usuário autenticado)
  const loadThreshold = async () => {
    try {
      const rows = await sbSelect('configuracoes','?chave=eq.threshold');
      if(rows?.[0]?.valor){ const v=parseFloat(rows[0].valor); if(!isNaN(v)&&v>0) setThreshold(v); }
    } catch {}
  };

  const loadRequests = async () => {
    setAppLoading(true);
    try {
      // NÃO traz os anexos (receipts) na lista — eles são pesados (base64). Carrega sob demanda ao abrir.
      const cols = 'id,title,description,amount,category,status,tipo,chave_pix,servico_convertido,setor,solicitante_id,solicitante_name,created_by,history,totvs,sent_to_totvs,created_at,updated_at,valor_aprovado,favorecido,numero';
      const rows = await sbSelect('requests',`?select=${cols}&order=created_at.desc`)||[];
      const normalized = rows.map(r=>({
        ...r,
        solicitanteId:     r.solicitante_id||'',
        solicitanteName:   r.solicitante_name||r.created_by||'',
        tipo:              r.tipo||'pagamento',
        chave_pix:         r.chave_pix||'',
        favorecido:        r.favorecido||'',
        servico_convertido:r.servico_convertido||false,
        setor:             r.setor||'',
        created_at: r.created_at
          ? new Date(r.created_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})
          : '',
        created_ts: r.created_at ? new Date(r.created_at).getTime() : 0,
        updated_ts: r.updated_at ? new Date(r.updated_at).getTime() : (r.created_at ? new Date(r.created_at).getTime() : 0),
        receipts: r.receipts||[],
        history:  r.history||[],
        totvs:    r.totvs||{},
      }));
      dispatch({type:'SET', reqs: normalized});
    } catch(e){ showToast('Aviso: nao foi possivel carregar do banco','err'); }
    setAppLoading(false);
  };

  const handleLogin = async (u) => {
    setUser(u);
    setView(u.role==='solicitante'?'pagamentos':'dashboard');
    loadThreshold();
    await loadRequests();
  };

  // Mantém o usuário logado ao recarregar a página (restaura a sessão salva)
  const [booting,setBooting] = useState(!!REFRESH_TOKEN);
  useEffect(()=>{
    if(!REFRESH_TOKEN){ setBooting(false); return; }
    (async()=>{
      try{
        if(!ACCESS_TOKEN){ if(!await sbRefresh()) throw 0; }
        const getUser = ()=>fetch(`${SUPABASE_URL}/auth/v1/user`,{headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${ACCESS_TOKEN}`}});
        let ures = await getUser();
        if(ures.status===401 && await sbRefresh()) ures = await getUser();
        if(!ures.ok) throw 0;
        const au = await ures.json();
        const rows = await sbSelect('profiles',`?auth_id=eq.${au.id}&limit=1`);
        if(rows && rows[0] && rows[0].is_active){
          // Mostra o app já — a lista carrega em segundo plano (não trava a tela "Entrando…")
          setUser(rows[0]);
          setView(rows[0].role==='solicitante'?'pagamentos':'dashboard');
          setBooting(false);
          loadThreshold();
          loadRequests();
          return;
        } else sbSignOut();
      }catch(e){ sbSignOut(); }
      setBooting(false);
    })();
  },[]);

  const handleUpdate = async (updatedReq) => {
    const newStatus = updatedReq.status || 'pending_gestor';
    const toastMsg  = newStatus === 'pending_diretor'
      ? 'Reenviado ao diretor!'
      : 'Reenviado ao gestor!';
    dispatch({type:'EDIT_FIELDS', id:updatedReq.id, fields:{
      title:updatedReq.title, description:updatedReq.description,
      amount:updatedReq.amount, category:updatedReq.category,
      totvs:updatedReq.totvs, receipts:updatedReq.receipts,
      chave_pix:updatedReq.chave_pix, favorecido:updatedReq.favorecido,
      ...(updatedReq.valor_aprovado!==undefined?{valor_aprovado:updatedReq.valor_aprovado}:{}),
      status:newStatus, history:updatedReq.history,
    }});
    setEditingReq(null);
    setView(listView||'pagamentos');
    showToast(toastMsg);
    try {
      await sbUpdate('requests',{
        title:updatedReq.title, description:updatedReq.description,
        amount:updatedReq.amount, category:updatedReq.category,
        totvs:updatedReq.totvs, receipts:updatedReq.receipts,
        ...(updatedReq.chave_pix!==undefined?{chave_pix:updatedReq.chave_pix}:{}),
        ...(updatedReq.favorecido!==undefined?{favorecido:updatedReq.favorecido}:{}),
        ...(updatedReq.valor_aprovado!==undefined?{valor_aprovado:updatedReq.valor_aprovado}:{}),
        status:newStatus, history:updatedReq.history,
        updated_at:new Date().toISOString(),
      },`?id=eq.${updatedReq.id}`);
    } catch(e){
      // Se o banco recusou (ex.: trava de valor), mostra a mensagem real e desfaz a alteração local
      const msg = /maior que o aprovado|valor_aprovado/i.test(e.message||'')
        ? 'Valor superior ao aprovado pelo aprovador — alteração não salva.'
        : (e.message||'Erro ao salvar no banco');
      showToast(msg,'err');
      loadRequests();
    }
  };

  const handleSubmit = async (req) => {
    dispatch({type:'ADD',req});
    setView(req.tipo==='servico'?'servicos':'pagamentos');
    const msg = req.tipo==='servico'?'Serviço enviado ao diretor!':(req.status==='pending_diretor'?'Pagamento enviado ao diretor!':'Solicitação enviada para o gestor!');
    showToast(msg);
    try {
      const inserted = await sbInsert('requests',{
        id:req.id, title:req.title,
        description:req.description||'', amount:req.amount,
        category:req.category||'', status:req.status,
        tipo:req.tipo||'pagamento',
        chave_pix:req.chave_pix||'',
        favorecido:req.favorecido||'',
        servico_convertido:req.servico_convertido||false,
        setor:user.setor||'',
        created_by:req.solicitanteName,
        solicitante_id:req.solicitanteId,
        solicitante_name:req.solicitanteName,
        history:req.history, totvs:req.totvs,
        receipts:(req.receipts||[]).map(r=>({name:r.name,type:r.type,data:r.data})),
        sent_to_totvs:false,
      });
      const numero = Array.isArray(inserted) ? inserted[0]?.numero : inserted?.numero;
      if(numero!=null) dispatch({type:'EDIT_FIELDS', id:req.id, fields:{numero}});
    } catch(e){ showToast('Aviso: erro ao salvar no banco','err'); }
  };

  // Abre a solicitação e carrega os anexos sob demanda (não vêm na lista, pra deixar rápido)
  const openDetail = (id, list) => {
    setListView(list); setSelected(id); setView('detail');
    const cur = requests.find(r=>r.id===id);
    if(cur && !cur._recLoaded){
      sbSelect('requests', `?id=eq.${id}&select=receipts`).then(rows=>{
        const rec = (rows && rows[0] && rows[0].receipts) ? rows[0].receipts : [];
        dispatch({type:'EDIT_FIELDS', id, fields:{receipts:rec, _recLoaded:true}});
      }).catch(()=>{});
    }
  };

  const syncDispatch = async (action) => {
    dispatch(action);
    if(action.type==='UPDATE'){
      try {
        const cur = requests.find(r=>r.id===action.id);
        const newHist = [...(cur?.history||[]),{
          date:fmtDate(), actor:action.actor, action:action.label, comment:action.comment||''
        }];
        await sbUpdate('requests',{
          status:action.status, history:newHist,
          ...(action.fields||{}),
          updated_at:new Date().toISOString(),
        },`?id=eq.${action.id}`);
      } catch(e){ console.warn('Supabase sync:',e); }
    }
    // CONVERT é tratado diretamente pelo convertService() no RequestDetail (já faz sbUpdate)
  };

  // ── Verificação automática de situação no TOTVS (cancela no site o que foi cancelado lá) ──
  const requestsRef = useRef(requests); requestsRef.current = requests;
  const syncRef = useRef(syncDispatch); syncRef.current = syncDispatch;
  const totvsSyncRunning = useRef(false);
  const runTotvsSync = useCallback(async ()=>{
    if(totvsSyncRunning.current) return;
    if(!user || !['admin','financeiro'].includes(user.role)) return;
    const candidates = (requestsRef.current||[]).filter(r=> r.sent_to_totvs && r.totvs?.duplicateCode && r.status!=='cancelled');
    if(!candidates.length) return;
    totvsSyncRunning.current = true;
    try{
      const token = await totvsGetToken();
      const cancelled = await totvsFetchCancelledCodes(token, candidates.map(r=>r.totvs.duplicateCode));
      for(const r of candidates){
        if(cancelled.has(Number(r.totvs.duplicateCode))){
          await syncRef.current({type:'UPDATE', id:r.id, status:'cancelled', actor:'Sistema',
            label:`Cancelado automaticamente — duplicata cancelada no TOTVS (verificado em ${fmtDate()})`, comment:''});
        }
      }
    }catch(e){ console.warn('TOTVS sync:',e); }
    finally{ totvsSyncRunning.current = false; }
  },[user]);

  useEffect(()=>{
    if(!user || !['admin','financeiro'].includes(user.role)) return;
    const t0 = setTimeout(runTotvsSync, 20000);        // 20s depois de abrir
    const iv = setInterval(runTotvsSync, 5*60*1000);  // a cada 5 min
    return ()=>{ clearTimeout(t0); clearInterval(iv); };
  },[user, runTotvsSync]);

  if(booting) return (
    <div className="min-h-screen flex flex-col items-center justify-center gap-4"
      style={{background:'radial-gradient(1200px 600px at 50% -10%, #332E2F 0%, #282425 55%, #201C1D 100%)'}}>
      <DeepLogo variant="login"/>
      <span style={{color:'#9A928A',fontSize:'12px',letterSpacing:'0.18em'}}>Entrando…</span>
    </div>
  );
  if(!user) return <LoginPage onLogin={handleLogin}/>;
  if(user.must_change_password) return <ForcePasswordChange user={user} onDone={()=>setUser(u=>({...u,must_change_password:false}))} onLogout={()=>{sbSignOut();setUser(null);}}/>;

  const selectedReq = requests.find(r=>r.id===selected);
  const toastStyle  = toast?.type==='ok' ? {background:'#282425',color:'#C9BBAA'} : {background:'#DC2626',color:'#fff'};

  return (
    <div className="min-h-screen" style={{background:'var(--page)'}}>
      <Sidebar user={user} view={view} setView={setView}
        onLogout={()=>{sbSignOut();setUser(null);dispatch({type:'SET',reqs:[]});}}
        onNewRequest={()=>setView('new')} mobileOpen={menuOpen} onClose={()=>setMenuOpen(false)}/>

      <div className="md:hidden fixed top-0 left-0 right-0 z-20 flex items-center justify-between px-4 py-3"
        style={{background:'var(--noir)',borderBottom:'1px solid var(--noir-line)'}}>
        <button onClick={()=>setMenuOpen(true)} style={{color:'var(--bone)',cursor:'pointer'}}><I.menu/></button>
        <DeepLogo variant="mobile"/>
        <div className="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold"
          style={{background:'rgba(221,212,201,.18)',color:'var(--bone)'}}>
          {user.name.split(' ').map(w=>w[0]).slice(0,2).join('')}
        </div>
      </div>

      <main className="md:ml-56 pt-14 md:pt-0">
        <div className="max-w-5xl mx-auto px-4 md:px-8 py-6 md:py-8">

          {toast&&(
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-full text-sm font-semibold shadow-xl fade flex items-center gap-2" style={toastStyle}>
              {toast.type==='ok'?<I.check/>:<I.alert/>} {toast.msg}
            </div>
          )}

          {appLoading?(
            <div className="flex items-center justify-center py-24 gap-3">
              <Spinner/><span style={{color:'var(--ink-soft)',fontSize:'14px'}}>Carregando...</span>
            </div>
          ):(
            <>
              {view==='dashboard' && <DashboardView user={user} requests={requests}/>}
              {view==='pagamentos'&& <SolicitacoesView user={user} requests={requests} tipoFilter='pagamentos' onSelect={id=>openDetail(id,'pagamentos')} onNew={()=>{setListView('pagamentos');setView('new');}} dispatch={syncDispatch} showToast={showToast}/>}
              {view==='servicos'  && <SolicitacoesView user={user} requests={requests} tipoFilter='servicos'   onSelect={id=>openDetail(id,'servicos')}   onNew={()=>{setListView('servicos');setView('new');}}   dispatch={syncDispatch} showToast={showToast}/>}
              {view==='new'       && <NewRequestForm user={user} requests={requests} defaultTipo={listView==='servicos'?'servico':'pagamento'} onSubmit={handleSubmit} onBack={()=>setView(listView||'pagamentos')}/>}
              {view==='edit'      && <NewRequestForm user={user} requests={requests} editReq={editingReq} onSubmit={handleUpdate} onBack={()=>{setEditingReq(null);setView('detail');}}/>}
              {view==='detail'&&selectedReq && <RequestDetail req={selectedReq} user={user} onBack={()=>setView(listView||'pagamentos')} dispatch={syncDispatch} showToast={showToast} onEdit={r=>{setEditingReq(r);setView('edit');}}/>}
              {view==='admin'     && <AdminView showToast={showToast}/>}
            </>
          )}

        </div>
      </main>

      <div className="hidden md:block fixed bottom-3 right-4 text-xs font-mono" style={{color:'#B8AE9E'}}>Deep Pagamentos</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
